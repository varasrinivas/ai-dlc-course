<p class="hook">A new engineer joins the portal team on a Tuesday. By Thursday she ships a send-back fix to the intake module — not because anyone briefed her for three days, but because the repo briefed her in ninety minutes: the steering file told her how this team builds, the decision log and semantic map told her what's true about this system and its crusty eligibility neighbor, and bolt 1's close-out told her exactly where bolt 2 stands. Then she asks the question this module answers: "My last team used Codex — do I have to relearn all of this?" No. The filename changes. The pattern doesn't.</p>

<h2>The memory hierarchy</h2>
<p>Everything Track 3 has produced organizes into three layers, sorted by how often they change. The <strong>steering file</strong> — how we build here: conventions, domain guardrails, workflow rules. It changes rarely, and only by reviewed edit. <strong>System knowledge</strong> — <code>decisions.md</code> and the semantic map: what's true about this system. It grows one confirmed line at a time. <strong>Per-bolt artifacts</strong> — plans, elaboration logs, close-outs: one set per bolt, then they become history.</p>
<p>Engines read the stack top-down at session start — steering first, then system knowledge, then the current bolt's chain. So should a new human; that's why Tuesday-to-Thursday onboarding works. The placement rule is one sentence: <em>if it applies to every future change, steering; if it's a fact about this system, knowledge; if it's about this bolt, plan.</em></p>

<h2>Plan files as durable memory</h2>
<p>Sessions are stateless <em>on purpose</em>. Chat history is not memory — it's exhaust. The artifact chain is memory: kill a session mid-bolt and nothing written down is lost; the next session (or the next engine, or the next human) resumes by reading. M09's close-out is this mechanism at bolt scale — the handoff artifact between bolts, between teams, and between engines.</p>
<p>The anti-pattern has a familiar face: "the AI remembers." A decision that lives only in a transcript is M06's undecided-and-unowned wearing a memory costume — one crash, one context window, one engine switch away from gone. If it mattered, it's in a file; if it's not in a file, it didn't happen.</p>

<aside class="analogy">
<p>Helping a friend plan her own build, Meera asked which firm she'd hired — and recognized everything when the friend showed her their "site ledger." Different binder, same three layers Meera knew from the build book: the front section that never changes (how this firm builds — clearances, sign-off rules), the middle that grows slowly (what's true about this house and this lot), and the daily sheets (today's package, today's decisions). Ravi flipped through it and laughed: "The front section is word-for-word what our firm believes. They just call it something else." The pattern was the industry's. Only the label on the binder belonged to the firm.</p>
<span class="maps-to">maps to → <b>three layers of the binder</b> = steering file · system knowledge · per-bolt artifacts · <b>front section that never changes</b> = standing rules, edited rarely and by review · <b>same book, different label</b> = CLAUDE.md / AGENTS.md / Project Rules / Kiro Steering — one pattern, many names</span>
</aside>

<h2>One pattern, many names</h2>
<p>Now the rule this course has been living since M00, stated plainly: <strong>the steering file is one pattern with many names.</strong> Claude Code reads <code>CLAUDE.md</code>. Codex CLI reads <code>AGENTS.md</code>. Amazon Q Developer calls it Project Rules. Kiro calls it Steering. The content — conventions, domain rules, guardrails, workflow pointers — is the same idea in the same position: standing rules the engine loads before it does anything. Learn the pattern once; rename the file per engine.</p>
<p>For a dual-engine team, the tempting move is twin files with identical rules — and that is exactly where drift becomes a silent fork of "how we build": one engine collecting all validation errors while the other fails fast is a bug you'll hunt for a day. Prefer <strong>one source of truth plus an import</strong>: the rules live in <code>AGENTS.md</code>, and <code>CLAUDE.md</code> pulls them in with <code>@AGENTS.md</code>. That is how <code>prior-auth-api</code> ships, and the section below shows why the import beats duplication. Duplication is the fallback only for engines with no import mechanism — and then you sync it mechanically (generate one from the other, or diff them in CI). What belongs in steering: anything with a "rarely changes" cadence. What doesn't: per-bolt state, secrets, and anything a decision log or plan should own.</p>

<h2>How a file physically becomes memory</h2>
    <div class="callout-strong">Writing a file does not make it memory. A file on disk is not
    in the model's context.</div>

    <p>"Context memory" isn't a feature you switch on. It's a file <em>plus a mechanism that
    loads it</em>. For Claude Code there are exactly three tiers, and it matters which one
    you're relying on:</p>

    <div class="table-scroll">
      <table class="bridge">
        <thead><tr><th>Tier</th><th>What</th><th>When it loads</th></tr></thead>
        <tbody>
          <tr><td><b>Automatic</b></td><td><code>CLAUDE.md</code> in the project root, in any ancestor directory, and <code>~/.claude/CLAUDE.md</code></td>
            <td>Eagerly, in full, at launch — <b>before your first prompt</b></td></tr>
          <tr><td><b>Imported</b></td><td>Any file named with <code>@path</code> inside <code>CLAUDE.md</code> — recursive to a max depth of 5 hops, ignored inside code fences</td>
            <td>Eagerly at launch, alongside the file importing it</td></tr>
          <tr><td><b>Everything else</b></td><td><code>docs/decisions.md</code>, <code>docs/units/</code>, all your source</td>
            <td><b>Not in context at all</b> — until the model calls the Read tool (usually because an instruction told it to), a grep finds it, you <code>@</code>-mention it, or a hook or skill reads it</td></tr>
        </tbody>
      </table>
    </div>

    <p>So which tier should the decision log be in? The repo puts it in tier 2, deliberately —
    these two imports are the load-bearing lines of its <code>CLAUDE.md</code>:</p>

    <div class="artifact doc">
      <div class="artifact-name"><b>prior-auth-api/CLAUDE.md</b> (excerpt)</div>
      <pre>@AGENTS.md
@docs/decisions.md</pre>
    </div>

    <p>The steering file <em>asks</em> the engine to read the decision log before touching a
    rule — that's tier 3, and an instruction is a request. Requests get skipped when context
    grows long or a prompt gets insistent. The <code>@</code> import makes it
    <strong>mechanical</strong>: the log is in context before the session starts, and nothing
    has to remember to fetch it. Same lesson as plan mode — mechanical beats contractual.</p>

    <p>It also explains why the two steering files are <em>split</em> rather than duplicated:
    <strong>Claude Code doesn't read <code>AGENTS.md</code> at all.</strong> The import is what
    lets one file steer both engines without drift. Codex has no import mechanism, so for that
    engine the decision log stays contractual — same intent, weaker guarantee.</p>

    <p>The cost is real: an import spends those tokens <em>every session</em>, relevant or not.
    Worth it here because the log is short and load-bearing; when it outgrows its tokens, you
    import an index and read entries on demand. Making that call is what
    <strong>semantics per token</strong> means in practice.</p>

    <p>Don't take it on faith, either: <code>/context</code> shows what's actually loaded right
    now, and <code>/memory</code> shows which memory files are configured. If you're unsure
    whether the decision log made it in — look, don't assume.</p>

<h2>What Claude Code reads, and when</h2>
<p><code>CLAUDE.md</code> loads at launch, before any prompt exists. That position is the whole trick: the session starts already knowing how this team builds, so steering outranks conversation the way a constitution outranks a motion. The engine doesn't have to be reminded, and neither does the teammate who joined Tuesday.</p>
<p>There's a cascade. A global <code>~/.claude/CLAUDE.md</code> carries personal defaults; the project root's <code>CLAUDE.md</code> carries team rules — in version control, edited by review, like any artifact that binds everyone; subdirectory <code>CLAUDE.md</code> files scope module-specific rules. All of them <strong>load additively</strong> — Claude Code assembles the applicable files rather than picking a winner — so "most specific wins" is a convention teams adopt, not documented tool behavior. Write rules that don't contradict; where two could, say in the text itself which governs. And what belongs in the project file is M13's top layer verbatim: conventions, domain guardrails, workflow rules, and pointers to the knowledge layer (<code>decisions.md</code>, the semantic map) — pointers, not copies.</p>

<h2>Enforcement in practice</h2>
<p>The dividing line between steering and prompting: <strong>a prompt asks once; a rule holds for every session and every teammate.</strong> The working heuristic — if you've typed the same instruction three times, it's a rule; move it. And when a ritual has steps, not just standards, it becomes a command: <code>.claude/commands/</code> turns multi-step workflows (plan-first construction, bolt close) into slash commands the whole team invokes identically. The kit that built this course runs on exactly that pattern.</p>
<p>Rules collide and rot like any code. A collision surfacing as an engine question is the system working — that's plan→ask→defer applied to its own configuration. Staleness gets fixed by reviewed edit; and every edit lands in <code>AGENTS.md</code>, where both engines read it — put a rule anywhere else and you've shipped M13's silent-fork bug into your own standards. Mechanical enforcement — hooks, permission gates that make rules physically binding — is M17's business; today the rules bind by being read.</p>

<h2>One unit of work per session</h2>
<p>The rule is blunt — <strong>one session, one unit of work</strong> — and it has three reasons. Context stays <em>dense</em>: M12's economics apply to your own session, which should hold one UW's worth of meaning, not a day's residue. Diffs stay <em>reviewable</em>: M08's understand-every-line discipline is arithmetic, and a session that built two things presents a diff that reviews like neither. Failures stay <em>local</em>: a session that goes sideways costs one UW, not a Wednesday-sized hole in the bolt.</p>
<p>A session opens by reading the chain — steering auto-loads (M14), and the approved plan and decisions arrive by pointer — and it closes by writing: increment merged or parked, summary in docs/, then <code>/clear</code>. Because sessions are stateless by design (M13), killing a confused one is cheap <em>and correct</em>: everything worth keeping already left as an artifact.</p>

<h2>The loop inside the session</h2>
<p>Inside the session, M07's pipeline becomes a rhythm: the plan is posted (or resumed from the one already approved), the checkpoint holds, then the engine builds in steps and validates continuously. Steering mid-loop is normal, not failure — interrupt, redirect, or narrow-block a step on a deferred decision exactly the way M02's transcript froze step 6 while the rest proceeded.</p>
<p>One protocol earns its keep at review time: the engine flags plan deviations <em>as it makes them</em>. Do that, and Mob Construction's deviations-first opening (M08) writes itself — the increment arrives with its departures already annotated instead of discovered.</p>

<h2>The permission model</h2>
<p>Claude Code's default posture is the right instinct formalized: <strong>read freely, ask before mutating.</strong> File edits and shell commands prompt for approval; reads don't. From there you tune: allowlist the safe and frequent (<code>npx jest</code>, read-only git) in <code>.claude/settings.json</code> so they flow without prompts, and keep every mutation of consequence behind one.</p>
<p>Permission modes set the session's posture wholesale: <em>default</em> (ask), <em>acceptEdits</em> (trusted tight loops on low-risk slices), <em>plan</em> (read-only — M15's Inception habitat), and <em>bypass</em> — which has no business anywhere near a guardrail repo, because a mode that never asks is M01's first anti-pattern with a config flag. The tuning principle is M02's decision table applied to tooling: the exposure boundary gets a human every time; reversible, low-blast actions flow free.</p>

<h2>Hooks: gates as code</h2>
<p><strong>Hooks fire on engine events</strong> — before a tool runs (PreToolUse, which can block the action), after it runs (PostToolUse, which can validate what happened), and at session stop. They are configuration, not hope: nobody has to remember them, including the engine.</p>
<p>Two hooks are canon for the portal, and both start from one fact: <strong>a Claude Code hook matcher matches tool <em>names</em>, never file paths</strong> — <code>Edit|Write</code>, not <code>src/**</code>. Path scoping is the hook script's job; it reads the tool-input JSON on stdin and decides from <code>tool_input.file_path</code>. <em>PostToolUse:</em> the script runs <code>npx jest</code> when the edited path is under <code>src/</code> — M16's "engine runs the gates" promoted from prompt convention to mechanism the session cannot skip. <em>PreToolUse:</em> the script refuses when the target is a file the threshold lives in, unless <code>docs/decisions/</code> contains a matching record — M14's steering rule made physical. That list is the whole gate: the portal's 0.85 is a constant in <code>src/domain/clinical-criteria.ts</code> today and moves to <code>config/threshold.json</code> in bolt 2 (M25), so the script must name both or the lock has a door left open. And the loop closes correctly: a failing hook's output goes back to the engine, which iterates; the human sees only work that survived the machines. M08's gate ordering, mechanized.</p>

<h2>Designing the approval topology</h2>
<p>With mechanism available, the design question changes from "how do we remember?" to "where do humans belong?" The answer is already written — M02's decision table: guardrail files, deploys, PHI egress get a human gate. Almost nothing else should. Every prompt-for-approval spends scarce attention, and a topology that gates everything trains humans to rubber-stamp — <strong>alert fatigue is how real checkpoints die.</strong></p>
<p>So spend asymmetrically: machine gates are free and tireless — hook jest to every edit, lint to every save, syntax checks to everything. Human gates are scarce — position them where blast radius lives, and audit the topology at bolt close: which gates fired, which were rubber-stamped, which caught something. A gate nobody has ever seen fail is either perfect or decorative; the close-out is where you find out which.</p>

<p class="hook">Bolt 3 has two units of work that don't touch: the channel-preference lookup and the undeliverable-notification routing. The engineer could run them as two sequential sessions — ninety minutes each. Instead the main session becomes a foreman: it pins the one interface both slices share, spawns two subagents with scoped prompts, and watches them build in parallel — each in its own fresh context window, each scoped by its prompt to its own files. (The context isolation is the tool's; the file separation is the prompt's — both subagents work the same tree.) Forty minutes later it merges the two increments, runs the full gate suite on the combined result, and presents one integrated diff for review. The parallelism is real. So is the part that kept it safe: the interface was pinned <em>before</em> the fan-out, not negotiated during the merge.</p>

<h2>Subagents: fan out the work</h2>
<p>A <strong>subagent</strong> is an independent agent context spawned from your main session: its own context window, a scoped instruction, and a result reported back to the orchestrator. The isolation is the point — each subagent is a fresh M16 session <em>by construction</em>: no residue, one concern, and a subagent that goes sideways costs its slice, not the bolt.</p>
<p>Three fan-outs earn their keep. <strong>Disjoint units of work:</strong> build two slices at once (this module's centerpiece). <strong>Exploration:</strong> survey a brownfield estate from multiple angles simultaneously — one subagent per subsystem, results merged into the semantic map. <strong>Review lenses:</strong> one subagent per concern — criteria coverage, constraint compliance, PHI — each reading the same increment cold, the M08 mob approximated in silicon before the human mob convenes.</p>

<h2>Parallel units of work</h2>
<p>Parallelize what's <strong>disjoint</strong> directly; what's <strong>coupled</strong> — one unit consuming another's output — parallelizes only after a stub makes it disjoint in practice (<em>coupled seams</em>, below). M03's sizing rule already made units of work reviewable; add "touches different files" and the same slicing pays twice — reviewability and parallelizability come from the same discipline. Two agents in one file is not parallelism; it's a merge conflict with extra steps.</p>
<p>The orchestrator works like a foreman, not a bystander: it pins the shared contracts, writes each subagent's scoped prompt (context by pointer — the steering file and chain do the heavy lifting, M15), collects the increments, and integrates. And note what does <em>not</em> parallelize: accountability. Subagent output is increment output — it meets the same Mob Construction gate as anything else. Parallel construction, serial checkpoints.</p>

<aside class="analogy">
<p>With the schedule tightening, the North crew split for the first time: the framing pair took the guest room while the electrician roughed-in the study — two rooms, two packages, one wall between them. The foreman's trick was all in the morning: before anyone lifted a tool, he chalked the shared wall himself — every stud position, every box height — and both teams signed it. At four he walked the seam first, not the rooms. One outlet sat a hand-width off the chalk; the electrician moved it before the walkthrough, grumbling, because the chalk had his signature on it. Two rooms in one day; one seam, checked first.</p>
<span class="maps-to">maps to → <b>two rooms, two packages</b> = disjoint UWs in parallel subagents · <b>the chalked shared wall, signed first</b> = interface contracts pinned before fan-out · <b>walking the seam first</b> = gates on the merged whole · <b>moving the outlet to the chalk</b> = conflicts re-plan to the contract, never force-merge</span>
</aside>

<h2>Merge discipline</h2>
<p><strong>Pin the seams first.</strong> Every shared interface — DTOs, ports, function signatures — is agreed and written down <em>before</em> the fan-out, in a contract file both subagents receive. A subagent that discovers it needs to change a pinned contract has exactly one move: stop and defer. That's plan→ask→defer operating at the seam, and it's what prevents the worst merge pathology — two halves each internally perfect and mutually incompatible.</p>
<p>Then: integrate, and <strong>run the full gates on the merged whole</strong> — each slice green does not imply the union green; the seam is precisely where neither slice's tests were looking. Conflicts trigger a narrow re-plan of the smaller slice, never a force-merge. And log every seam event: one collision is noise, repeated collisions on the same seam mean the decomposition was wrong — feedback that belongs in the next Inception.</p>

<h2>Coupled seams: when a unit needs another's output</h2>
<p>Everything so far assumed <strong>disjoint</strong> units — a shared interface, but neither slice waiting on the other's result. Real backlogs aren't so kind. In the capstone, B3's review queue <em>consumes</em> the score B2 <em>produces</em>: a genuine producer/consumer dependency. You have two honest moves, and choosing between them is the skill.</p>
<p><strong>Serialise.</strong> Order the units so the producer finishes first — B2 before B3, the capstone's default. Always correct, needs no scaffolding, costs only wall-clock. When the interface is still moving or the consumer is small, this is the right answer; don't build machinery to dodge a short wait.</p>
<p><strong>Decouple with a contract and a stub.</strong> Pin the interface exactly as you would for disjoint fan-out — but now the contract does double duty: the producer builds <em>to</em> it, the consumer builds <em>against a stub of it</em>, a fake that returns contract-shaped data so the consumer's bolt runs before the producer exists. Two coupled units become two parallel bolts. The price is the stub plus one real integration test at the seam — because a consumer that only ever met the stub has never met the real producer.</p>
<p>The rule: <strong>stub-decouple only when the interface is stable and the seam is small; otherwise serialise.</strong> And a dependency discovered <em>mid-bolt</em> isn't a merge to muscle through — it's the seam reporting that the decomposition was wrong. Stop, defer, re-order: the same protocol as every other pinned-contract surprise.</p>

<pre><code>ORCH: Contract pinned → docs/M18-contract.md:

B:    Restored. 5 tests green.
ORCH: Union: npx jest → 11 tests green (2 new seam tests).
      One integrated diff → review.</code></pre>
    <p><strong>Check yourself:</strong> (1) Why not just accept B's rename — it IS more consistent? (2) Where did the 2 extra union tests come from, and why didn't either subagent write them? (3) What would repeated collisions on this same seam tell the team?</p>
    <details><summary>Answers</summary>
      <p>(1) The contract encoded a decided PHI rule — memberRef exists so raw member ids never enter notification paths; "consistency" would quietly reopen a decided question during a merge, the worst possible time. A subagent that wants a seam change stops and defers. (2) The seam itself: neither slice's tests exercise the boundary between them — the orchestrator adds union tests because slice-green ≠ union-green. (3) The decomposition is wrong: UW-N2 and UW-N3 aren't as disjoint as Inception believed — feedback for the next Mob Elaboration, not a bigger merge hammer.</p>
    </details>

    <p><strong>Now the coupled case.</strong> B3's queue consumes the score B2 produces — producer/consumer, not disjoint. This log stub-decouples them so both build in parallel:</p>
<pre><code>ORCH: Contract pinned → docs/M18-scored.md:
      ScoredRequest { authRequestId, score }
ORCH: B2 (producer) builds to it. B3 (consumer) builds
      against a STUB returning ScoredRequest fixtures —
      runs before B2 exists.
B3:   Done. 6 tests green against the stub.
B2:   Done. persists the score as 'score', per the
      Determination entity — the stub had guessed
      'matchScore'.
ORCH: SEAM TEST FAILS — stub said matchScore, producer
      says score; B3 never met the real B2. Re-pin to
      'score', update B3's mapping.
ORCH: Union: seam integration test green. One diff → review.</code></pre>
    <p><strong>Check yourself:</strong> (4) B3 had six green tests against the stub and still shipped a bug. Why — and which test caught it?</p>
    <details><summary>Answer</summary>
      <p>Six green tests only proved B3 agrees with <em>its own stub</em> — and the stub was a guess about the producer (<code>matchScore</code>), not the producer (<code>score</code>, the field the <code>Determination</code> entity actually uses). A stub is a hypothesis, not the real thing. The one test that exercises consumer-against-<em>real</em>-producer is the seam integration test, so it is the only one positioned to catch a stub that lied. That is why stub-decouple always costs one real seam test: skip it and you have verified a fiction.</p>

<p class="hook">The South team joins the portal program — three engineers who've run Codex CLI for a year and have never opened Claude Code. Their onboarding takes one morning, and the interesting part is what they <em>don't</em> have to learn: the steering file reads the same, the decision log reads the same, the bolt rhythm and the checkpoints are the ones on the wall. What they teach the original team by Friday is the other half: Codex's approval postures, its sandbox, and one drift bug — a rule someone had written straight into CLAUDE.md, where Codex would never see it. Two engines, one methodology; the methodology traveled. The config almost didn't.</p>

<h2>Codex CLI in five minutes</h2>
<p>Launch <code>codex</code> in the repo and it reads <code>AGENTS.md</code> at start — the same position <code>CLAUDE.md</code> occupies, doing the same job: M14's "position is power" applies verbatim. The session shape is immediately familiar: state intent, receive proposals, approve or redirect. And M16's rule didn't change engines: one unit of work per session, enter reading the chain, leave writing artifacts.</p>
<p>Take inventory of what you already own from Track 4, because all of it transfers: intent phrasing, plan-first contracts, tagged question quotas, deferral lists, context by pointer. Track 5 is short on purpose — you're not learning a methodology, you're learning a second dialect.</p>

<h2>AGENTS.md as steering</h2>
<p><code>AGENTS.md</code> is the single source of truth from M13: the conventions, guardrails, workflow rules, and pointers into the knowledge layer all live here, and <code>CLAUDE.md</code> reaches the same text through its <code>@AGENTS.md</code> import. The cascade idea holds too — global config for personal defaults, the repo file for team law, nested files where a subdirectory needs local rules.</p>
<p>What differs is <strong>mechanics, not meaning</strong>. Codex has no <em>named</em> plan mode — plan-first is a contract you state and hold (M15's parity table) — and no hooks, so rule-specific gates are scripts the steering file obliges plus your review (M17's honest asymmetry). Be precise about that asymmetry, though: Codex's read-only/suggest posture <em>is</em> tool-enforced — a write cannot land without your approval, the same mechanical guarantee plan mode gives. What Codex lacks is the per-rule, event-driven gate (a hook that blocks <em>this</em> edit for <em>that</em> reason), not a write gate. The rules themselves never change; only their enforcement does. Which is why <strong>drift</strong> is the failure mode to fear: a rule written straight into <code>CLAUDE.md</code> never reaches Codex, and you get two teams building under different laws — silently. Prevent it structurally, the Lab M13 way: the rules live in one file and the other imports it, so there is nothing to keep in sync. Where both engines lack imports and duplication is forced, the rule becomes generate rather than hand-copy, and diff in CI — same goal, weaker guarantee.</p>

<aside class="analogy">
<p>The South crew took the second wing, and Meera braced for a week of re-explaining. It never came. Their foreman arrived with her own binder — different color, same three layers, and the house rules word for word. What differed was habit: the North crew's foreman signs off at fixed walkthrough times; the South foreman prefers you standing beside her as each package lands — "watch me apply it, approve it warm." The one real problem surfaced Wednesday: a rule Ravi had added to the North binder in March had never been copied south. Two crews, briefly, building under two laws. They fixed the binders — then stopped keeping two copies: one rule sheet now, and both binders point at it.</p>
<span class="maps-to">maps to → <b>same three layers, different binder</b> = AGENTS.md in the position CLAUDE.md holds · <b>"approve it warm"</b> = Codex approval postures vs fixed gates · <b>two laws</b> = steering drift when rules get duplicated · <b>one rule sheet, both binders point at it</b> = one source of truth plus an import</span>
</aside>

<h2>Approval modes and the sandbox</h2>
<p>Codex's trust dial has three broad postures. <strong>Suggest</strong>: the engine proposes diffs; a human applies them — maximum ceremony, every change warm-approved. <strong>Auto-edit</strong>: the engine writes files itself but asks before running commands. <strong>Full-auto</strong>: the engine executes end-to-end — inside a sandbox: network-disabled, scoped to the working directory. Containment is the counterweight for autonomy, where Claude Code's counterweight is hooks and permission prompts. Different sleeve, same arm. And note which end of the dial is real enforcement: suggest is not a promise — the tool will not land a write until you approve it.</p>
<p><strong>A naming caveat, because the tool moved.</strong> "Suggest / auto-edit / full-auto" are the <code>--approval-mode</code> values of the original (2025, TypeScript) Codex CLI. They stay the clearest names for the three postures, which is why this course keeps them — but the current (Rust) CLI splits the same dial in two: <code>--ask-for-approval</code> (<code>untrusted</code> · <code>on-failure</code> · <code>on-request</code> · <code>never</code>) and <code>--sandbox</code> (<code>read-only</code> · <code>workspace-write</code> · <code>danger-full-access</code>). Read across: suggest ≈ <code>--sandbox read-only</code> with <code>--ask-for-approval untrusted</code>; auto-edit ≈ <code>workspace-write</code> + <code>on-request</code>; full-auto ≈ <code>workspace-write</code> + <code>never</code>. Check <code>codex --help</code> for your build — the postures are the durable idea, the flag names are not.</p>
<p>The guardrail-repo recommendation writes itself from M10's rigor classes: suggest or auto-edit posture plus the M17 contractual gates for anything touching the portal's guardrails; full-auto only for slices the rigor policy classes low-risk — the gazebo, never the boathouse.</p>

<h2>The plan-only contract, mastered</h2>
<p>Codex has no plan mode, so the gate is a contract — and a mastered contract has three layers. The <strong>prompt clause</strong>: "do NOT write any file; plan and stop for my approval." The <strong>standing rule</strong> in AGENTS.md as backstop: "never create or modify files before an explicit 'approved' from the human" — steering, so it holds in every session including the ones where you forget the clause. And beneath both, the <strong>suggest posture</strong> (M19) — not a promise but a tool setting: an attempted write cannot land without your approval.</p>
<p>When the engine jumps the gun anyway — it happens — the recovery is mechanical, not emotional: revert, restate the contract, continue. If it recurs, the diagnosis is M14's: the standing rule is missing or weak. Defense in depth is the honest difference from plan mode — two contractual layers (prompt clause, standing rule) sitting on one that is genuinely tool-enforced, since in the read-only/suggest posture no write lands unapproved. Plan mode gets it from a single mode; Codex gets it from a posture plus a contract — and a disciplined team knows <em>which layer caught what</em>, because that's the data that says whether the contract is actually holding.</p>

<p>Everything M15 taught moves without translation: restate-first, tagged question quotas ([policy]/[edge]/[data]/[integration]), deferrals listed separately, context by pointer. The steering file carries the standards, so the prompt stays short. The quality tells are unchanged too — an Inception with zero questions assumed; a question that <code>decisions.md</code> already answers means the chain wasn't read. Session hygiene is M16 verbatim: one Inception per session, fresh context per epic.</p>

<p class="hook">The South team takes UW-R1 — the outreach-event query from the reporting epic — and the session looks familiar by design: plan, approval, build in steps, gates green, increment summary. Two things are new. The mechanical sweep mid-loop (renaming a DTO across 14 files) runs in full-auto inside the sandbox: no network, nothing outside the repo, blast radius bounded by construction. And at review, the South reviewer ignores the engine's tidy summary and reads the raw diff — where she finds a debug log line printing <code>memberId</code>. The summary didn't mention it. Summaries never do. The diff is where the truth lives, on every engine, and the discipline of reading it is what Codex's contractual gates are made of.</p>

<h2>The build loop in Codex</h2>
<p>M16 transfers verbatim: one unit of work per session, enter reading the chain, plan-first (contract, not mode — M20), build stepwise, exit writing artifacts. The Codex-specific choice is <strong>posture per slice</strong>: suggest for consequential work, where the tool itself will not land a write until you approve it; auto-edit for tight trusted loops, with the M17 gate scripts standing behind either. (Posture names stay M19's legacy <code>--approval-mode</code> vocabulary; map them onto your build's <code>--ask-for-approval</code> and <code>--sandbox</code> flags per M19's caveat.)</p>

<h2>The sandbox</h2>
<p>Full-auto's counterweight is the <strong>sandbox</strong>: execution with the network disabled and writes scoped to the working directory. It's containment engineering — M19's trade stated plainly: Claude Code counterweights autonomy with hooks and prompts; Codex counterweights it with walls.</p>
<p>Where it earns its keep: rigor-policy low-risk classes and big mechanical sweeps — the 14-file rename where prompting per step is pure fatigue with no added safety. What it does <em>not</em> replace: review. <strong>A sandboxed diff is a contained diff, not a correct one.</strong> Guardrail classes still run suggest posture and human gates; the boathouse never gets built behind plastic alone.</p>

<aside class="analogy">
<p>The South crew hung plastic sheeting before demolition week — a dust wall sealing the work zone from the finished wing. Inside it they moved fast: saws, dust, mistakes, all contained; nothing they did in there could stain the oiled floors beyond the plastic. But the wall had one zippered door, and the rule was absolute: every board, every fixture passed through it got looked at — in hand, in the light, not from the invoice. Ravi once tried to wave a trim bundle through on the paperwork. The foreman unzipped it anyway: two warped lengths, top of the stack. "Invoices lie politely," she said. "Boards don't."</p>

<h2>Diff review discipline</h2>
<p>The rule is four words: <strong>read the diff, not the summary.</strong> A summary is the author's theory of the diff — sincere, tidy, and silent about exactly the things it didn't consider important, like a debug line printing <code>memberId</code> into a log the M14 rule forbids. The hunks don't editorialize.</p>
<p>Structure the read the M08 way: deviations first (ask for them explicitly), then the criteria walk, then a cold read of anything unexplained. Let git be the checkpoint ledger — one commit per approved increment, so revert stays the cheap undo. And name the Codex-specific truth: with no per-rule hooks, <strong>the reviewer is the hook.</strong> The suggest posture stops every write mechanically — what it cannot do is know <em>which</em> write to stop or <em>why</em>, so what PreToolUse blocks for a named reason on Claude Code, the reviewer at the suggest gate blocks by reading. That's a scarce human gate doing mechanical duty — budget it with M17's fatigue economics, and let the gate scripts absorb everything scriptable first.</p>

<p class="hook">The platform director finally asks the question the team has been collecting evidence for: "Pick one engine — which?" And the team's answer, backed by ten modules of drill logs, is that it's the wrong question twice over. Wrong once because selection is per task profile, not per religion: the guardrail bolt wants the engine whose gates are mechanical today; the demolition-week refactor wants the sandbox. Wrong twice because the expensive asset was never the engine — it's the methodology living in files both engines read. The team can switch engines next bolt and lose nothing but muscle memory. That's not indecision. That's the whole point of how they built.</p>

<h2>Two profiles, honestly stated</h2>
<p>Ten modules of side-by-side work reduce to two enforcement profiles. <strong>Claude Code's edge is mechanical enforcement:</strong> plan mode locks writes during Inception (M15), hooks and permissions make gates fire without anyone remembering (M17), and native subagents give parallel work an orchestrator (M18). <strong>Codex's edge is containment plus warm review:</strong> the sandbox bounds full-auto blast radius (M21), and approval postures make every change a proposal a human touches on its way in (M19).</p>
<p>Notice what this framing leaves out: model benchmarks. Model quality shifts monthly and the rankings age like fish; enforcement mechanics and team fit persist. Select on what you can verify in your own drill logs — you've been writing them since M14 for exactly this meeting.</p>

<h2>Choosing per task profile</h2>
<p><strong>Guardrail-class work</strong> goes to whichever engine has the rule <em>mechanized in your repo today</em> — that's a lookup in your M17 drill log, not a brand question. <strong>Big mechanical sweeps</strong> want contained speed: sandbox full-auto, or acceptEdits with hooks. <strong>Consequential inceptions</strong> run fine on either — plan-gated both ways. <strong>Parallel disjoint UWs</strong> favor Claude Code's native subagents; worktree discipline works anywhere at the cost of you being the foreman.</p>
<p>And treat team habits as real inputs, not noise: a warm-approval culture fits Codex's diff-first flow; a gate-topology culture fits hooks. Fit reduces friction — and friction is what breeds the workarounds that bypass your checkpoints (M10's shadow queue, tooling edition).</p>

<aside class="analogy">
<p>By the street-facing wing, Meera and Ravi had stopped thinking of the crews as interchangeable — and stopped playing favorites. The millwork went to North: their lockout panel and fixed walkthroughs suited work where one wrong cut is a change order. Demolition week went South: the dust wall was built for fast and messy. For the entry hall — the room every visitor would judge — they did what the desk suggested: North built it, South walked it cold, reading the work in hand, no invoices. Ravi asked the desk which crew was "better." The desk tapped the build book: "The house doesn't care. Both crews read the same book."</p>
<span class="maps-to">maps to → <b>millwork to North</b> = mechanical gates for guardrail work · <b>demolition to South</b> = the sandbox for contained speed · <b>South walks North's room cold</b> = cross-engine review · <b>"both crews read the same book"</b> = one methodology, many engines</span>
</aside>

<h2>Run both, deliberately</h2>
<p>Three run-both patterns earned their receipts in this course. The <strong>parity experiment</strong> (M20): one consequential intent, two independent decompositions, differences arriving at the mob as options — free design review. <strong>Cross-engine review</strong> (M21): one engine builds, the other reads the hunks cold — two authors' theories, one diff. <strong>Split-by-class</strong>: each engine owns the change classes it enforces best, per your M22 policy table.</p>
<p>The tax is real: keeping one set of rules reaching both engines (M19's drift is a standing risk, not a one-time bug), doubled spend, and two dialects of muscle memory. A small team on a simple estate shouldn't pay it. And the strategic close, stated once more with everything behind it: <strong>one methodology, many engines.</strong> The steering file has many names — CLAUDE.md, AGENTS.md, Project Rules, Kiro Steering — but your rules, decisions, maps, plans, and close-outs are engine-neutral text. The lock-in test belongs in every bolt close: <em>could we switch engines next bolt?</em> If the answer is no, an artifact is missing. Find it. Write it.</p>

<h2>The capstone contract</h2>
<p>Four bolts, in dependency order. <strong>B1 — AuthRequest intake API</strong>: the real endpoints, extending the UW-1a/1b validation work. <strong>B2 — ClinicalCriteria matching</strong>: the scoring engine, the <code>AUTO_APPROVE_THRESHOLD (0.85)</code> path, the immutable score log. <strong>B3 — nurse review queue</strong>: routing everything below threshold, the 4-hour SLA alarm, assignment semantics. <strong>B4 — determinations and notifications</strong>: <code>Determination</code> records, the notify slices from UW-N1/N2/N3, the audit trail.</p>
<p>Each bolt runs the full ritual set: one Mob Elaboration, construction sessions per unit of work, Mob Construction per increment, the PHI-review stage wherever the rigor policy triggers it, and a bolt close. And one consequential decision opens the whole thing: the stack. NestJS scaffold now, or continue the minimal TypeScript structure and port later? Either is legitimate — which is exactly why it's deferred to humans and gets a decision record, not a reflex.</p>

<h2>Full Inception, run</h2>
<p>The kickoff session is M05's pipeline at full power: plan-gated engine, intent restated, requirements traced clause by clause to the guardrails. But watch what's different from the first time: <strong>most questions never get asked</strong>, because the chain answers them before they form. Eligibility staleness? <code>decisions.md</code>, I-1. What E4 means? The semantic map, confirmed by name. Urgent SLA? Decided in M06, 4 hours including STAT imaging. The payoff of five bolts of context memory is an Inception where the surviving questions are <em>genuinely new</em> — and there are three of them, not thirty.</p>
<p>The backlog artifact lists, per bolt: units of work sized by checkpoint, acceptance criteria that are testable, traceable, and edge-bearing, the gates each increment must pass, and dependencies. This epic qualifies for the M22 parity experiment — the most consequential decomposition left is exactly when two independent slicings earn their tax.</p>

<p>The <code>ClinicalCriteria</code> entity — criteria sets per procedureCode — and the <strong>matcher</strong>: it evaluates a RECEIVED <code>AuthRequest</code> against its criteria set and produces a match score from 0.0 to 1.0, with per-criterion components preserved. Then the path the whole portal pivots on: score ≥ <code>AUTO_APPROVE_THRESHOLD (0.85)</code> — read from the gated config, never a literal — produces AUTO_APPROVED and hands off to B4's determination record; score below routes the flag B3's queue consumes, with S2's 60-second clause carried.</p>
<p>And one ordering rule that is an acceptance criterion, not an implementation detail: <strong>every score persists immutably to the compliance store before any routing occurs.</strong> Priya's closed decision, now executable, now tested.</p>

<h2>The guardrail bolt: maximum rigor, familiar shape</h2>
<p>Nothing in this bolt is technically exotic — a scorer, a comparison, a log. The rigor policy doesn't care: guardrail class → full pipeline plus the PHI-review stage (M11), and the M17 lock stands over the config file. This is M10's lesson landing where it matters: <em>risk is not diff size.</em></p>
<p>The spine of the bolt is its <strong>negative tests</strong>. <code>no_auto_approval_below_threshold</code> proves the property — for below-threshold scores, approval is unreachable through any path. The exact threshold is decided out loud: 0.85 approves (≥, documented in the audit note). And the edge the adversarial reviewer found: an empty criteria set scores 0.0 and routes to nurse review — the system's ignorance never becomes a member's automatic approval. Alongside: <strong>explainability</strong> as a deliverable. The score log carries components — criterion, weight, matched — so "why 0.79?" has an answer a nurse can read. Notifications, meanwhile, still carry status and reference id only; explainability lives in the audit surface, not the message.</p>

<p class="hook">Six weeks after the funding email, the portal takes its first real traffic — three pilot provider groups, chosen because they phone the most. The deploy itself is the boring clockwork the team designed for: rings, sign-offs, alarms armed before requests flow. What's not boring is Thursday's dashboard: median turnaround for auto-approvable requests, 3.1 hours — against a 4.2-day baseline and a 24-hour promise. The queue alarm has fired zero times, which is the number the CMO actually checks. And Friday brings the first incident — notification retries hammering an undeliverable address — resolved in forty minutes because the audit walk made the path obvious, and closed with a learning that becomes next bolt's first line. The portal isn't finished. It's alive, and the system that built it is now the system that runs it.</p>

<h2>Ship in rings</h2>
<p>The rollout is M09 at program scale: <strong>staging</strong> (which the bolts already soaked for weeks) → <strong>pilot</strong> — three provider groups, real PHI, deliberately bounded blast radius — → <strong>full</strong>. Each ring transition is an exposure boundary with a named human sign-off; M02's table didn't change because the stakes grew, it's why the table existed.</p>
<p>The deployment artifacts are M09's set plus two program-level additions: a rollback plan per ring, and <strong>alarm verification before traffic</strong> — an unarmed alarm is a decorative one, and the skip-alarm gets test-fired against staging data before a single pilot request flows. The M17 gates ride along unchanged: the threshold config is locked in production exactly as it was in dev, because environments don't grant exemptions from policy.</p>

<h2>Observe the promise</h2>
<p>The primary dashboards are the intent's own clauses, measured: <strong>median turnaround for auto-approvable requests</strong> (promise: under 24 hours; pilot week: 3.1 hours against the 4.2-day baseline), the <strong>below-threshold-skip alarm</strong> (promise: zero, forever — zero fires so far, and that's the CMO's number), and <strong>urgent SLA compliance</strong> (4 hours; one near-miss at 3h40m, which is a learning, not a pass). Secondary: the score distribution — B2's hook, now feeding the quarterly criteria review and M31's metrics — and queue depth per nurse, the SME's workload visibility running live.</p>
<p>Friday's incident shows the operations half of the audit walk: notification retries hammering an undeliverable address traced in minutes — determination → notification → delivery attempts — because provenance is the system's shape. The fix ships with a new test (<code>caps_delivery_retries_then_routes_outreach</code>), the runbook grows a page, and the learning enters the chain. Incidents don't interrupt the methodology; they feed it.</p>

<p>Handover wasn't a ribbon; it was a transfer of the book. Final occupancy signed, the design desk walked Meera and Ravi through their own house one last time — then handed them the build book, complete: every as-built, every decision, every crew's notes. "It's yours now. So is the way of working." A month later they tested that promise on something small — a pergola over the patio. Ravi sketched the intent, the desk drafted overnight, one morning of questions, one crew, one day, one walkthrough. The pergola went up the way the house had: decided, recorded, signed. The house was finished. The way of building it wasn't.</p>

<p class="hook">The portal pod's numbers reach the VP of engineering, and her first question is organizational: "So do I reorg everyone into pods now?" The honest answer from the pilot: the pod wasn't a boxes-and-lines exercise — it was derived from one constraint. Every consequential decision needed its owner in the room within minutes, not tickets. Work backwards from that and the topology designs itself: five people, three jurisdictions, one SME on a hotline, two engines. The ceremonies didn't need abolishing; they starved — a status standup can't survive contact with a decision log everyone already read. What leaders own in this model isn't the process. It's the two numbers the process lives or dies on: how fast decisions arrive, and whether checkpoints stay real.</p>

<h2>Pods over squads</h2>
<p>The pod's sizing rule is M06 inverted into org design: <strong>a pod is as large as the room in which every decision-owner can convene in minutes.</strong> In practice: one decider (PO-shaped, with explicit jurisdiction), two to four engineers, SME access with jurisdiction of its own (the nurse's hotline, not the nurse's attendance), and the engines assigned per the routing policy.</p>
<p>The squad/chapter matrix optimized for skill utilization and coordination-by-ticket — rational when construction was the slow part. The pod optimizes for <strong>decision latency</strong>, because M02 made coordination the tempo-setter: a decision that waits a day now stalls a bolt that would have finished the same afternoon. And pods scale the only way that preserves the rule: split on decision-domain seams — one pod per house on the street — never by adding people until the room stops working.</p>

<h2>The ritual calendar</h2>
<p>Per bolt: <strong>Mob Elaboration</strong> opens it, <strong>Mob Construction</strong> guards its increments, the <strong>bolt close</strong> writes it down. That's the entire calendar, and its cadence follows bolts, not fortnights.</p>
<p>What dies, dies of starvation, not decree: the status standup (the chain already told everyone — reading <code>decisions.md</code> beats hearing it recited), sprint planning (Inception does it per bolt, with artifacts), the batch retro (learnings land at every bolt close instead of quarterly archaeology). The leader's calendar job is protection: air cover for M06's three-minute decision rule when a VP wants to relitigate in the room, and — above all — <strong>keeping deciders unblocked</strong>. A decider in back-to-back meetings is a stalled bolt wearing a busy calendar.</p>

<aside class="analogy">
<p>The lake house turned out so well that Meera and Ravi bought the parcel next door — twelve lots, a whole street. Their first instinct was a big weekly meeting of every foreman; it died in a fortnight, all status and no decisions. What replaced it was structure copied from what had worked: each lot got its own small site team — a foreman, two crews, a desk liaison — and one person with the owner's proxy who could answer questions the same hour they were asked. Meera's job changed shape: she stopped attending walkthroughs and started watching two numbers — how long site questions waited for answers, and whether walkthroughs were still real.</p>
<span class="maps-to">maps to → <b>one site team per lot</b> = pods split on decision-domain seams · <b>the owner's proxy on site</b> = the decision-owner on call · <b>the weekly meeting that died</b> = status ceremonies starved by the chain · <b>Meera's two numbers</b> = decision latency and checkpoint integrity</span>
</aside>

<h2>Role shifts</h2>
<p>Every role moves toward judgment. The <strong>PO</strong> stops grooming backlogs and becomes the decision-owner on call: jurisdiction explicit, latency measured, rationale recorded — the M24 idempotency call in four minutes is the job now. The <strong>architect</strong> stops writing documents that age and becomes the contract pinner and seam judge — M18's chalk, at street scale. <strong>QA</strong> stops authoring tests after code and becomes the gate designer and spot-explain auditor: owner of the gate stack's health, sampler of the room's actual understanding.</p>
<p>And the <strong>leader</strong> trades velocity theater for checkpoint topology: the M17 bolt-close audit — which gates fired, which rubber-stamped, which caught something — becomes a standing leadership artifact. Across all four shifts, one scarce skill appreciates fastest: <em>deciding quickly, with a rationale someone can read later.</em> Hire for it, coach it, measure it.</p>

<h2>Decision rights when one PO owns many lanes</h2>
<p>The pod's bottleneck has a name, and it is usually the decider. In a sprint the PO batched a week of calls into one refinement; under AI-DLC five parallel lanes can each surface a blocking decision the same afternoon, and one owner answering them serially stalls four bolts. The fix is not a faster PO — it is deciding <em>which</em> calls ever reach the PO at all.</p>
<p>Sort every recurring decision onto a three-rung ladder. <strong>Pre-decided:</strong> the answer already lives in the steering file or <code>decisions.md</code> — threshold semantics, the collect-all-errors rule, the PHI boundary. These reach no human; the chain answers them, which is the entire reason decisions get written down. <strong>Delegated:</strong> a named proxy holds bounded jurisdiction — a senior engineer on interface shapes, the architect on seams (M18) — and records the call like any other. <strong>Reserved:</strong> the irreversible and the regulated — a member-facing policy, a threshold change, anything an auditor will ask about — stay with the PO, who can now answer in minutes because the first two rungs cleared the queue.</p>
<p>Two backstops keep it honest. Give the reserved rung a <strong>latency SLA</strong>: the decider on call answers within the hour on bolt days, or the pod escalates by a written rule, not a hallway ambush. And when even the reserved calls overflow one person, that is not a delegation failure — it is the signal to <strong>split the pod at the decision-domain seam</strong>: two deciders, two jurisdictions, the same rule that scales pods now scaling deciders.</p>

<h2>What you can't flip overnight</h2>
<p>A sprint team runs on three habits, and a Monday memo changes none of them. The <strong>calendar</strong> is fortnight-shaped — planning, standups, review, retro, all sized for two weeks of slow construction. The <strong>board</strong> is the system of record, trusted more than any prose. And the <strong>decision cadence</strong> is batched: questions wait for refinement because, in a sprint, a day's delay costs nothing. AI-DLC inverts all three, and inverting them by decree gets you the worst of both — a team carrying sprint overhead while a bolt waits on a decision nobody is on call to make.</p>
<p>So migrate in stages. Run the <strong>first two or three bolts with training wheels</strong>: alongside — not instead of — the closing sprint, on one low-risk unit of work, with a coach in the room. The goal of bolt 1 is not velocity; it is the team feeling the loop once — Inception in the morning, an engine building against approved criteria, a checkpoint that is real. You are teaching a rhythm, and a rhythm is learned by doing it, not by reading the schedule that describes it.</p>

<h2>Your Jira or Rally board after the switch</h2>
<p>The board is not thrown away — it is <strong>remapped</strong>, and keeping it as the record of <em>what</em> is what makes the migration survivable. A Jira epic becomes a bolt (or a short run of them); its stories become the <strong>units of work</strong> the bolt is sliced into at Inception; the acceptance criteria you would have written on the story are exactly M06's testable criteria, just authored in the room with the decider present. Story points and velocity retire in favor of <strong>bolt lead time</strong> (M31) — time from signed intent to signed increment, measured not estimated. The burndown and the standup give way to the chain: <code>decisions.md</code>, the plan, and the close-out say where things stand, and they say <em>why</em>, which a board column never did.</p>
<p>Two rules keep the remap honest. The tracker records <em>what</em> and <em>who</em>; the chain records <em>why</em> — never split a decision's rationale into a Jira comment the engine can't read. And migrate the board incrementally: one epic converted to a bolt is a demonstration the team can watch, not a big-bang re-import that leaves everyone hunting for their work on Monday.</p>

<h2>Responsible AI is a lifecycle property, not a checklist</h2>
<p>The responsible-AI dimensions this module works through — <strong>fairness, explainability, privacy &amp; security, controllability, transparency, governance</strong>, six of the eight AWS names (safety and veracity &amp; robustness bite hardest when the product itself is a model; here it is a scored rule under human review) — usually arrive at a team as a compliance checklist bolted on after the build. AI-DLC's claim is structural: each dimension attaches to a checkpoint the lifecycle already runs, so responsibility is exercised where the work happens rather than audited after it ships.</p>
<p><strong>Inception owns fairness.</strong> Mob Elaboration already asks "what should this do?" — the responsible version adds "who could this harm?" to the same session, while requirements are still cheap to change. <strong>Construction owns controllability and transparency:</strong> understand-every-line (M08) and the chain (M13) mean nothing merges unexplained and every decision has a named approver. <strong>Operations owns the audit trail and drift:</strong> the same observability that watches latency watches approval rates by cohort.</p>

<h2>PHI-safe context hygiene</h2>
<p>Prompts, steering files, plan files, semantic maps, Mob Elaboration transcripts — all of it is context, and <strong>context leaves the building</strong>. In a healthcare system the rule has to be mechanical, not aspirational: <strong>decisions and schemas belong in the chain; member data never does.</strong> The chain records that the team chose nurse review for sub-threshold scores and why. It never records that Rosa Delgado's request scored 0.71.</p>
<p>Make the rule enforce itself by putting it where the engine reads first: the steering file. A "fixtures are synthetic-only" line in <code>CLAUDE.md</code> or <code>AGENTS.md</code> means every future bolt inherits the constraint — the steering file is a responsible-AI control surface, not just a productivity trick. And M12's brownfield discipline pays a privacy dividend: a semantic map summarizes structure, not records. High semantics-per-token is also high privacy-per-token.</p>

<h2>Provenance: who wrote this code, who made this call</h2>
<p>Explainability as aspiration is a paragraph in a policy doc. Explainability as schema is three fields on every <code>Determination</code>: <code>score</code>, <code>criteriaVersion</code>, and <code>decidedBy</code> — <code>"auto"</code> or a nurse identifier. With those three, the compliance officer's seven-word question has a seven-second answer, for any determination, forever.</p>
<p>Code has provenance too. The chain names the human who approved each plan; understand-every-line is the moment accountability for AI-written code transfers to a person. That's the invariant under everything this course has taught: <strong>accountability never transfers to the engine.</strong> The engine builds. The names on the checkpoint answer for the build.</p>

/* labs are copy-paste driven: every code block in the body gets a copy button.
   The wrapper doubles as the "already wired" marker, so this is safe to re-run. */
function wireCopyButtons() {
  $root.querySelectorAll("pre").forEach(addCopyButton);
}

/* wraps one <pre> and pins a copy chip to it. Shared by the module bodies and by
   the prelude simulator, which builds its artifact blocks as the bolt plays. */
function addCopyButton(pre) {
  if (pre.parentElement.classList.contains("copy-wrap")) return;
  const wrap = document.createElement("div");
  wrap.className = "copy-wrap" + (pre.closest(".artifact.doc") ? " light" : "");
  pre.parentNode.insertBefore(wrap, pre);
  wrap.appendChild(pre);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy-btn";
  btn.textContent = "Copy";
  btn.setAttribute("aria-label", "Copy this code block");
  /* the file is CRLF on disk, so textContent carries \r\n — a stray \r pasted
     into a shell is at best noise, at worst a second Enter. Normalise. */
  btn.addEventListener("click", () => copyBlock(pre.textContent.replace(/\r\n/g, "\n"), btn));
  wrap.appendChild(btn);
}

/* navigator.clipboard needs a secure context; this file is often opened straight
   off disk, so fall back to the old textarea + execCommand path when it is absent
   or rejects (Safari/Firefox over file://). */
function copyBlock(text, btn) {
  const settle = ok => {
    btn.textContent = ok ? "Copied ✓" : "Copy failed";
    btn.classList.toggle("copied", ok);
    btn.classList.toggle("failed", !ok);
    clearTimeout(btn._resetT);
    btn._resetT = setTimeout(() => {
      btn.textContent = "Copy";
      btn.classList.remove("copied", "failed");
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => settle(true), () => settle(legacyCopy(text)));
  } else {
    settle(legacyCopy(text));
  }
}

function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:-9999px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function wireEngineTabs() {
  $root.querySelectorAll(".engine-tabs").forEach(tabs => {
    tabs.querySelectorAll(".engine-tab-btns button").forEach(btn => {
      btn.addEventListener("click", () => {
        const eng = btn.dataset.engine;

        tabs.querySelectorAll(".engine-pane").forEach(p => p.classList.toggle("active", p.dataset.engine === eng));
      });
    });
  });
}

        "## Acceptance criteria\n" +
        "1. AuthStatus gains PENDING_NURSE_REVIEW.\n" +
        "2. A criteria match below AUTO_APPROVE_THRESHOLD (0.85) routes the\n" +
        "   AuthRequest to PENDING_NURSE_REVIEW, not to a generic PENDING.\n" +
        "3. A match at exactly 0.85 auto-approves. The rule is >=, and the\n" +
        "   boundary is asserted by a test so nobody re-litigates it.\n" +
        "4. " + (state.rescore === "stands"
              ? "A re-score below threshold on an already-determined request\n   leaves the determination intact and opens a NEW request.\n   (decision: docs/decisions.md#rescore)"
              : "A re-score below threshold on an already-determined request\n   reopens it into PENDING_NURSE_REVIEW.\n   (decision: docs/decisions.md#rescore)") + "\n" +
        "\n" +
        "## Out of scope\n" +
        "- The nurse queue UI. Separate unit of work, separate bolt.",
        { doc: true }),
      sys("criterion 4 exists because you answered. an AI-managed run would have shipped a coin flip here.")
    ]
  },

  /* 4 — Construction: the plan, and the checkpoint */
  {
    phase: "construction",
    lines: () => [
      ai("Construction. Here's my plan — I'm showing it to you <em>before</em> writing anything, because a plan is cheap to reject and a pull request is not."),
      file("plan",
        "1. Write the failing tests first (4 cases, incl. the 0.85 boundary).\n" +
        "2. Add PENDING_NURSE_REVIEW to the AuthStatus enum.\n" +
        "3. Route below-threshold matches to it in DeterminationService.\n" +
        "\n" +
        "Touches:  auth-status.enum.ts, determination.service.ts\n" +
        "Does not touch:  the criteria scoring engine. Out of scope.",
        { doc: true }),
      sys("⏸  human checkpoint — construction does not start until you say so")
    ],
    choice: {
      prompt: "This is the checkpoint. It is not a rubber stamp — try sending it back.",
      options: [
        {
          label: "Approve the plan",
          after: () => [ you("Approved. Go.") ]
        },
        {
          label: "Send it back",
          after: () => {
            state.sentBack = true;
            return [
              you("Send it back. Nothing in that plan writes an audit entry when a request changes status. Compliance will ask, and I'd rather answer now than in an audit."),
              ai("You're right, and I'd have missed it — an audit trail isn't derivable from the code I was given. This is exactly what the checkpoint is for. Revised:"),
              file("plan (revised)",
                "1. Write the failing tests first (5 cases now, incl. the audit entry).\n" +
                "2. Add PENDING_NURSE_REVIEW to the AuthStatus enum.\n" +
                "3. Route below-threshold matches to it in DeterminationService.\n" +
                "4. Emit an AuditLog entry on every AuthStatus transition.  <-- yours\n" +
                "\n" +
                "Touches:  auth-status.enum.ts, determination.service.ts, audit-log.service.ts\n" +
                "Does not touch:  the criteria scoring engine. Out of scope.",
                { doc: true })
            ];
          },
          follow: {
            prompt: "Now it's a better plan than either of you would have written alone.",
            options: [ { label: "Approve the revised plan", after: () => [ you("Approved. Go.") ] } ]
          }
        }
      ]
    }
  },

  /* 5 — Construction: tests first, then code */
  {
    phase: "construction",
    lines: () => [
      ai("Tests first. They fail now, which is the only way to know they'd catch anything later."),
      file("prior-auth-api/src/determination/determination.service.spec.ts",
        "describe('DeterminationService', () => {\n" +
        "  it('auto_approves_at_or_above_threshold', ...)        // 0.86 -> APPROVED\n" +
        "  it('auto_approves_exactly_at_threshold', ...)          // 0.85 -> APPROVED\n" +
        "  it('routes_below_threshold_to_nurse_review', ...)      // 0.84 -> PENDING_NURSE_REVIEW\n" +
        "  it('" + (state.rescore === "stands"
              ? "keeps_determination_final_on_rescore"
              : "reopens_approved_auth_to_nurse_review_on_rescore") + "', ...)" +
        (state.sentBack ? "\n  it('writes_audit_entry_on_every_status_transition', ...)  // yours" : "") + "\n" +
        "})",
        { engine: "# Claude Code" }),
      sys((state.sentBack ? "5" : "4") + " failing — good. they fail for the right reason."),
      ai("Now the code."),
      file("prior-auth-api/src/determination/auth-status.enum.ts",
        "export enum AuthStatus {\n" +
        "  DRAFT = 'DRAFT',\n" +
        "  APPROVED = 'APPROVED',\n" +
        "  DENIED = 'DENIED',\n" +
        "  PENDING_NURSE_REVIEW = 'PENDING_NURSE_REVIEW',   // this bolt\n" +
        "}"),
      sys("✓ " + (state.sentBack ? "5" : "4") + " passing", true),
      ai("You can read every line of that. That's the actual bar — not \"it compiles\", not \"the tests are green\". If you can't read it, you can't be the human in <em>human oversight</em>, and the whole method collapses into the first lane.")
    ]
  },

  /* 6 — Operations: the part teams drop */
  {
    phase: "operations",
    lines: () => [
      ai("Operations. The code ships — but this is the beat most teams drop, and it's the one that compounds. Your decision goes somewhere durable, so the next bolt starts already knowing it."),
      file("CLAUDE.md",
        "  ## Domain guardrails\n" +
        "  - AUTO_APPROVE_THRESHOLD = 0.85. The rule is >=; 0.85 auto-approves.\n" +
        "+ - A determination that already exists is " +
          (state.rescore === "stands" ? "FINAL. A below-threshold\n+   re-score opens a NEW request; it never withdraws an approval.\n"
                                      : "REOPENED by a below-threshold\n+   re-score, into PENDING_NURSE_REVIEW.\n") +
        "+   Rationale + who decided: docs/decisions.md#rescore\n" +
        "+   This is a clinical policy decision. Do not change it from a prompt.",
        { doc: true }),
      sys("context preserved → the next session opens already knowing this", true),
      ai("That's the bolt. Hours, not weeks. One unit of work. One question I refused to guess at. One checkpoint you actually used. One decision that outlives this session — and that will quote itself back at the next person who asks me to \"just set the threshold to 0.7 for a test\"."),
      sys("Codex CLI runs this same bolt with different words and the same artifacts. Track 5 does it side by side.")
    ]
  }
];

/* ---------------- rendering ---------------- */
const $screen = document.getElementById("introScreen");
const $controls = document.getElementById("introControls");
const $count = document.getElementById("introCount");
const $after = document.getElementById("introAfter");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let idx = 0;

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

function addLine(l) {
  let node;
  if (l.who === "file") {
    node = el("div", "line in");
    node.appendChild(el("span", "tag sys", "out"));
    const box = el("div", "artifact" + (l.doc ? " doc" : ""));
    const name = el("div", "artifact-name");
    name.appendChild(el("b", null, l.name));
    if (l.engine) name.appendChild(el("span", "eng", l.engine));
    box.appendChild(name);
    const pre = document.createElement("pre");
    pre.textContent = l.code;          // never parsed as HTML
    box.appendChild(pre);
    addCopyButton(pre);                // the file the bolt just produced is copyable
    const wrap = el("div", "txt");
    wrap.appendChild(box);
    node.appendChild(wrap);
  } else if (l.who === "record") {
    node = el("div", "line in");
    node.appendChild(el("span", "tag sys", "log"));
    const box = el("div", "record");
    box.appendChild(el("span", "rl", l.label));
    box.appendChild(el("div", null, l.text));
    const wrap = el("div", "txt");
    wrap.appendChild(box);
    node.appendChild(wrap);
  } else {
    node = el("div", "line in " + l.who);
    node.appendChild(el("span", "tag " + l.who, l.who === "you" ? "you" : l.who === "ai" ? "ai" : "sys"));
    node.appendChild(el("div", "txt" + (l.ok ? " ok" : ""), l.text));
  }
  if (reduced) node.classList.remove("in");
  $screen.appendChild(node);
  return node;
}

function litPhase(phase) {
  const order = ["inception", "construction", "operations"];
  const upto = order.indexOf(phase);
  document.querySelectorAll("#introRail .ph").forEach(p => {
    p.classList.toggle("lit", order.indexOf(p.dataset.phase) <= upto);
  });
}

function renderChoice(choice) {
  $controls.innerHTML = "";
  const ask = el("div", "ask");
  ask.appendChild(el("span", "hint", "your call — the AI will not make this one"));
  ask.appendChild(document.createTextNode(choice.prompt));
  $controls.appendChild(ask);
  const opts = el("div", "opts");
  choice.options.forEach(o => {
    const b = el("button", "opt", o.label);
    b.addEventListener("click", () => {
      let last;
      o.after().forEach(l => { last = addLine(l); });
      if (last) last.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
      if (o.follow) renderChoice(o.follow);
      else { idx++; renderPlay(); }
    });
    opts.appendChild(b);
  });
  $controls.appendChild(opts);
}

function renderPlay() {
  $controls.innerHTML = "";
  $count.textContent = "beat " + Math.min(idx, BEATS.length) + " of " + BEATS.length;
  if (idx >= BEATS.length) {
    const done = el("div", "done-note", "✓ bolt complete — one unit of work, shipped, with its reasoning preserved");
    $controls.appendChild(done);
    $after.hidden = false;
    return;
  }
  const b = el("button", "play", idx === 0 ? "▶  Start the bolt" : "▶  Play the next beat");
  b.addEventListener("click", play);
  $controls.appendChild(b);
}

function play() {
  const beat = BEATS[idx];
  litPhase(beat.phase);
  let last;
  beat.lines().forEach(l => { last = addLine(l); });
  if (last) last.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
  $count.textContent = "beat " + (idx + 1) + " of " + BEATS.length;
  if (beat.choice) renderChoice(beat.choice);
  else { idx++; renderPlay(); }
}

renderPlay();
}

function updateProgress() {
  const vis = visibleMods();
  const done = vis.filter(m => completed.has(m.id)).length;
  const pct = (vis.length ? (done / vis.length) * 100 : 0) + "%";
  $ptext.textContent = done + " / " + vis.length;
  $fill.style.width = pct;
  $mfill.style.width = pct;
}

/* ---------------- mobile nav drawer ---------------- */
function openNav() {
  $sidebar.classList.add("open");
  $backdrop.classList.add("show");
  document.body.classList.add("nav-open");
  $menuBtn.setAttribute("aria-expanded", "true");
  const active = $sidebar.querySelector(".mod-btn.active");
  if (active) active.scrollIntoView({ block: "center" });
}
function closeNav() {
  $sidebar.classList.remove("open");
  $backdrop.classList.remove("show");
  document.body.classList.remove("nav-open");
  $menuBtn.setAttribute("aria-expanded", "false");
}
$menuBtn.addEventListener("click", () =>
  $sidebar.classList.contains("open") ? closeNav() : openNav());
$backdrop.addEventListener("click", closeNav);
document.getElementById("drawerClose").addEventListener("click", closeNav);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });
/* rotating to landscape past the breakpoint must not leave the body scroll-locked */
window.addEventListener("resize", () => { if (window.innerWidth > 900) closeNav(); });

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentIdx > 0) { currentIdx--; render(); }
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentIdx < MODS.length - 1) { currentIdx++; render(); }
});
$done.addEventListener("click", () => {
  const id = MODS[currentIdx].id;
  if (completed.has(id)) completed.delete(id); else completed.add(id);
  render();
});
document.querySelectorAll(".aud-filter button").forEach(btn => {
  btn.addEventListener("click", () => {
    audFilter = btn.dataset.aud;
    document.querySelectorAll(".aud-filter button").forEach(b => b.classList.toggle("active", b === btn));
    buildNav();
    updateProgress();
  });
});

function goToHash() {
  const id = location.hash.replace("#", "").toUpperCase();
  const idx = MODS.findIndex(m => m.id === id);
  if (idx >= 0) currentIdx = idx;
}
window.addEventListener("hashchange", () => { goToHash(); render(); });
goToHash();
render();
</script>
</body>
