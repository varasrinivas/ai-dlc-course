<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AI-DLC — Method, Engines, and Leadership</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* palette — clinical daylight */
  --paper:#f3f5f8; --panel:#ffffff; --ink:#16202e; --ink-soft:#4b5a6e; --line:#dde3ec;
  --accent:#b45309; /* bolt amber */
  --ok:#0d9488; --warn:#be185d;
  /* track colors */
  --t0:#6366f1; --t1:#b45309; --t2:#0d9488; --t3:#7c3aed;
  --t4:#c2410c; --t5:#1d4ed8; --t6:#be185d; --t7:#4d7c0f;
  --radius:10px;
  --font-display:"Fraunces",serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px}
a{color:var(--t5)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout — minmax(0,1fr), not 1fr: a bare 1fr floors the column at the content's
   min-content width, letting a wide code block widen the whole page instead of scrolling itself */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.main{min-width:0}

/* sidebar */
.sidebar{background:var(--ink);color:#e8edf5;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.3;letter-spacing:.2px}
.brand .kicker{display:block;font-family:var(--font-mono);font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#f0b35e;margin-bottom:6px}
.progress-wrap{margin:16px 0 8px}
.progress-label{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;color:#9fb0c6;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#2a3648;border-radius:3px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#f0b35e);border-radius:3px;transition:width .35s ease}
.aud-filter{display:flex;gap:6px;margin:14px 0 18px}
.aud-filter button{flex:1;background:#212c3c;color:#c6d2e2;border:1px solid #34445c;border-radius:6px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.05em;padding:6px 2px;text-transform:uppercase}
.aud-filter button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.track-group{margin-bottom:14px}
.track-head{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9fb0c6;padding:6px 4px}
.track-dot{width:9px;height:9px;border-radius:2px;flex:none}
.mod-btn{display:flex;width:100%;text-align:left;background:transparent;border:none;color:#d5deea;border-radius:7px;padding:7px 8px;gap:9px;align-items:baseline;font-size:.82rem}
.mod-btn:hover{background:#243040}
.mod-btn.active{background:#2c3a4e}
.mod-btn.done .mod-id{background:var(--ok);color:#fff}
.mod-id{font-family:var(--font-mono);font-size:.64rem;font-weight:600;background:#33425a;border-radius:4px;padding:1px 5px;flex:none}
.mod-title{flex:1;line-height:1.35}
.aud-tag{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.05em;color:#8fa2ba;text-transform:uppercase;flex:none}
.mod-btn.hidden{display:none}

/* main */
.main{padding:0 0 80px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(243,245,248,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 40px;display:flex;align-items:center;gap:14px}
.actions{display:flex;align-items:center;gap:10px}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;width:40px;height:40px;flex:none;align-items:center;justify-content:center;color:var(--ink)}
.menu-btn svg{width:18px;height:18px;display:block}
.backdrop{position:fixed;inset:0;z-index:8;background:rgba(11,17,26,.5);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}
.backdrop.show{opacity:1;visibility:visible}
.drawer-close{display:none}
.m-progress{display:none} /* mobile-only mirror of the sidebar progress bar */
.crumb{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.crumb b{color:var(--track-color,var(--t0))}
.topbar .spacer{flex:1}
.nav-btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 14px;font-size:.8rem;color:var(--ink)}
.nav-btn:hover{border-color:var(--ink-soft)}
.done-btn{background:var(--ink);color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:.8rem}
.done-btn.is-done{background:var(--ok)}

.module{max-width:860px;margin:0 auto;padding:38px 40px}
@media (max-width:900px){.module{padding:26px 16px}}

/* bolt rail — the signature */
.bolt-rail{display:flex;align-items:center;gap:0;margin:0 0 30px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.bolt-rail .phase{display:flex;align-items:center;gap:7px}
.bolt-rail .phase::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
.bolt-rail .phase.lit::before{background:var(--accent);border-color:var(--accent)}
.bolt-rail .wire{flex:1;height:2px;background:var(--line);margin:0 10px;min-width:26px}
.bolt-rail .bolt{color:var(--accent);font-size:.9rem;margin-left:12px}

.mod-header .mod-kicker{font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--track-color,var(--t0))}
h1{font-family:var(--font-display);font-weight:700;font-size:2.15rem;line-height:1.15;margin:8px 0 6px;letter-spacing:-.01em}
.mod-meta{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:26px}
h2{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:38px 0 12px;letter-spacing:-.005em}
h3{font-size:1.02rem;font-weight:600;margin:22px 0 8px}
p{margin:0 0 14px;max-width:70ch}
ul,ol{margin:0 0 16px 22px;max-width:70ch}
li{margin-bottom:6px}
strong{font-weight:600}

.hook{background:var(--panel);border-left:4px solid var(--track-color,var(--t0));border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;font-size:1.02rem;color:var(--ink);max-width:none}
.callout{background:#fff8ef;border:1px solid #f1dcbd;border-radius:var(--radius);padding:14px 18px;margin:18px 0;font-size:.93rem}
.callout b{color:var(--accent)}

/* the Lakeview build — recurring analogy component */
.analogy{background:linear-gradient(0deg,#fdfaf4,#fdfaf4);border:1px solid #e8dcc4;border-radius:var(--radius);padding:16px 18px 14px;margin:22px 0;font-size:.92rem;position:relative}
.analogy::before{content:"🏠 THE LAKEVIEW BUILD";display:block;font-family:var(--font-mono);font-size:.6rem;font-weight:600;letter-spacing:.16em;color:#9a7b3f;margin-bottom:8px}
.analogy p{margin-bottom:6px;max-width:none}
.analogy .maps-to{display:block;font-family:var(--font-mono);font-size:.68rem;color:var(--ink-soft);border-top:1px dashed #e8dcc4;margin-top:10px;padding-top:8px}
.analogy .maps-to b{color:var(--accent)}

figure{margin:26px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
figure svg{width:100%;height:auto;display:block}
figcaption{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-soft);letter-spacing:.06em;margin-top:12px;text-align:center}

table.bridge{width:100%;border-collapse:collapse;margin:18px 0;font-size:.9rem;background:var(--panel);border-radius:var(--radius);overflow:hidden}
table.bridge th{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;text-align:left;background:var(--ink);color:#e8edf5;padding:9px 14px}
table.bridge td{padding:9px 14px;border-top:1px solid var(--line)}
table.bridge td:first-child{color:var(--ink-soft)}
table.bridge td b{font-weight:600}

pre{background:var(--ink);color:#e6edf7;border-radius:var(--radius);padding:16px 18px;overflow-x:auto;font-family:var(--font-mono);font-size:.8rem;line-height:1.6;margin:14px 0}
/* inline code holds long unbreakable identifiers (rejects_ineligible_with_one_outreach_entry);
   without a break opportunity they widen the page on narrow screens. Code in <pre> must not
   wrap — that block scrolls instead. */
code{font-family:var(--font-mono);font-size:.85em;background:#e7ebf2;border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
pre code{background:none;padding:0;overflow-wrap:normal}

/* copy button — the player wraps every <pre> in a module body at render time so
   lab prompts and commands are one click away instead of a drag-select */
.copy-wrap{position:relative}
.copy-btn{position:absolute;top:8px;right:8px;z-index:2;line-height:1;
  font-family:var(--font-mono);font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 9px;border-radius:6px;background:#243040;color:#c3cede;border:1px solid #3a4a61;
  opacity:0;transition:opacity .15s ease,color .15s ease,border-color .15s ease}
.copy-wrap:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
.copy-btn:hover{color:#fff;border-color:var(--accent)}
.copy-btn.copied{opacity:1;color:#5eead4;border-color:#5eead4}
.copy-btn.failed{opacity:1;color:#fda4d4;border-color:#fda4d4}
/* light code blocks (.artifact.doc) need the inverse chip */
.copy-wrap.light .copy-btn{background:#eef1f6;color:var(--ink-soft);border-color:var(--line)}
.copy-wrap.light .copy-btn:hover{color:var(--ink);border-color:var(--accent)}
.copy-wrap.light .copy-btn.copied{color:var(--ok);border-color:var(--ok)}
.copy-wrap.light .copy-btn.failed{color:var(--warn);border-color:var(--warn)}
/* touch has no hover: keep it visible but quiet, and big enough to hit */
@media (hover:none){.copy-btn{opacity:.8;padding:8px 11px}}

/* lab */
.lab{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin:40px 0 0}
.lab-head{font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lab h2{margin-top:0}
.path{border-top:1px dashed var(--line);margin-top:20px;padding-top:18px}
.path-label{font-family:var(--font-mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600;font-size:.9rem}

.lab-gh{display:inline-block;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.05em;
  color:var(--t5);text-decoration:none;border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;margin:2px 0 12px;background:#fafbfd}
.lab-gh:hover{border-color:var(--t5)}

/* engine tabs */
.engine-tabs{margin:14px 0}
.engine-tab-btns{display:flex;gap:6px;margin-bottom:-1px;position:relative;z-index:1}
.engine-tab-btns button{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;padding:7px 16px;border:1px solid var(--line);border-bottom:none;background:#e9edf3;color:var(--ink-soft);border-radius:8px 8px 0 0}
.engine-tab-btns button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.engine-pane{display:none;border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:14px 16px;background:#fafbfd}
.engine-pane.active{display:block}
.engine-pane pre{margin:8px 0}

.recap{background:var(--ink);color:#e8edf5;border-radius:var(--radius);padding:22px 26px;margin:36px 0 0}
.recap h2{color:#fff;margin-top:0;font-size:1.2rem}
.recap ul{margin-bottom:0}
.recap .next{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:#f0b35e;margin-top:14px;display:block}

.paths-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
@media (max-width:700px){.paths-grid{grid-template-columns:1fr}}
.path-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.path-card .pc-head{font-family:var(--font-mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.path-card.leader .pc-head{color:var(--t7)}
.path-card.practitioner .pc-head{color:var(--t4)}
.path-card p{font-size:.88rem;margin-bottom:0}

/* wide content (bridge tables) scrolls inside its own rail, never the page */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:18px 0}
.table-scroll table.bridge{margin:0}

/* ---------------- mobile ---------------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}

  /* sidebar becomes an off-canvas drawer; brand/progress/filter stay pinned
     while only the module list scrolls, so the close button never scrolls away */
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:9;width:min(86vw,320px);height:100dvh;
    transform:translateX(-100%);transition:transform .24s ease;padding:18px 14px 0;
    display:flex;flex-direction:column;overflow:hidden}
  .sidebar.open{transform:none;box-shadow:0 0 44px rgba(11,17,26,.45)}
  #trackNav{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  body.nav-open{overflow:hidden}
  .drawer-close{display:flex;position:absolute;top:14px;right:12px;align-items:center;justify-content:center;
    width:36px;height:36px;background:#212c3c;border:1px solid #34445c;border-radius:8px;color:#c6d2e2;font-size:1.1rem;line-height:1}
  .brand{padding-right:44px}
  .menu-btn{display:flex}
  .mod-btn{padding:10px 8px;font-size:.86rem;min-height:44px;align-items:center}
  .aud-filter button{min-height:44px}

  /* topbar keeps orientation; actions move to the thumb zone.
     backdrop-filter here would make .topbar the containing block for the
     fixed .actions bar, pinning it under the topbar instead of the viewport */
  .topbar{padding:8px 14px;gap:10px;backdrop-filter:none;background:var(--paper)}
  .crumb{font-size:.62rem;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:6;gap:8px;
    background:rgba(243,245,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .m-progress{display:block;position:absolute;top:0;left:0;right:0;height:3px;background:var(--line)}
  .m-progress div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#f0b35e);transition:width .35s ease}
  .actions .nav-btn{flex:1;min-height:44px;padding:11px 8px}
  .actions .done-btn{flex:1.4;min-height:44px;padding:11px 8px}
  .main{padding-bottom:104px}

  /* type + blocks reflow */
  .module{padding:22px 16px}
  h1{font-size:1.6rem}
  h2{font-size:1.2rem;margin:30px 0 10px}
  .bolt-rail{flex-wrap:wrap;gap:8px 0;font-size:.58rem;margin-bottom:24px}
  .bolt-rail .wire{min-width:14px;margin:0 7px}
  .bolt-rail .bolt{margin-left:8px}
  .hook{padding:14px 16px;font-size:.98rem}
  figure{padding:14px 12px}
  .lab{padding:18px 16px}
  .recap{padding:18px 16px}
  .analogy{padding:14px 14px 12px}
  pre{font-size:.72rem;padding:12px 14px}
  .table-scroll table.bridge{min-width:460px}
  .engine-tab-btns{flex-wrap:wrap;gap:4px}
  .engine-tab-btns button{padding:9px 14px}
  summary{padding:4px 0}
}
@media (max-width:380px){
  h1{font-size:1.42rem}
  .actions .nav-btn{font-size:.74rem}
  .actions .done-btn{font-size:.74rem}
}

/* ---- prelude (P00) components, ported from intro.html ---- */
/* the simulator */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 0;
  box-shadow:0 1px 2px rgba(22,32,46,.04),0 12px 32px -12px rgba(22,32,46,.14)}
.sim-head{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sim-title{font-family:var(--font-mono);font-size:.64rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.sim-head .grow{flex:1}
.beat-count{font-family:var(--font-mono);font-size:.64rem;color:var(--ink-soft);letter-spacing:.08em}

/* phase rail, echoing the player's bolt rail */
.rail{display:flex;align-items:center;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);padding:0 18px 12px;flex-wrap:wrap;gap:6px 0}
.rail .ph{display:flex;align-items:center;gap:6px;transition:color .3s ease}
.rail .ph::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:var(--panel);transition:all .3s ease}
.rail .ph.lit{color:var(--ink)}
.rail .ph.lit::before{background:var(--accent);border-color:var(--accent)}
.rail .wire{flex:1;height:2px;background:var(--line);margin:0 8px;min-width:16px}

.screen{padding:6px 18px 18px;max-height:none}
.line{margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.line.in{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tag{font-family:var(--font-mono);font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border-radius:4px;padding:3px 6px;flex:none;margin-top:3px;min-width:34px;text-align:center}
.tag.you{background:var(--ink);color:#fff}
.tag.ai{background:#ece9fe;color:var(--t3)}
.tag.sys{background:transparent;color:var(--ink-soft);border:1px dashed var(--line)}
.line .txt{font-size:.95rem;flex:1;min-width:0}
.line.you .txt{font-weight:500}
.line.sys .txt{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-soft)}
.line.sys .txt.ok{color:var(--ok)}
.line .txt code{font-family:var(--font-mono);font-size:.84em;background:#e7ebf2;border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}

/* artifact box — a file the bolt produced */
.artifact{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:4px 0}
.artifact-name{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-soft);
  background:#f7f9fc;border-bottom:1px solid var(--line);padding:7px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.artifact-name b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.artifact-name .eng{margin-left:auto;color:var(--t4);font-weight:600}
.artifact pre{background:var(--ink);color:#e6edf7;padding:13px 14px;overflow-x:auto;
  font-family:var(--font-mono);font-size:.74rem;line-height:1.65;white-space:pre}
.artifact.doc pre{background:#fbfcfe;color:var(--ink)}

/* the decision record — the thing the course is really about */
.record{border-left:4px solid var(--accent);background:#fff8ef;border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 14px;font-size:.88rem}
.record .rl{font-family:var(--font-mono);font-size:.58rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}

/* controls */
.controls{border-top:1px solid var(--line);background:#fafbfd;padding:14px 18px}
.play{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:.88rem;font-weight:500;min-height:44px}
.play:hover{background:#243040}
.play[disabled]{opacity:.45;cursor:default}
.ask{font-size:.88rem;margin-bottom:10px;font-weight:500}
.ask .hint{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{background:var(--panel);border:1px solid var(--ink-soft);border-radius:8px;padding:11px 16px;
  font-size:.86rem;color:var(--ink);min-height:44px;text-align:left}
.opt:hover{border-color:var(--accent);background:#fff8ef}
.done-note{font-family:var(--font-mono);font-size:.7rem;color:var(--ok);letter-spacing:.05em}

const MODS = [
{
  id: "P00",
  track: 0,
  title: "Prelude: You're the Tech Lead Now",
  minutes: 15,
  audience: "both",
  body: `
<p class="hook">AI-DLC is AWS's methodology for building software with AI. Strip the vocabulary away and it is one sentence: <strong>you stop being the person who types the code, and become the person the code has to get past.</strong> This prelude explains that the way you'd explain it to a teammate, hands you one cycle to run, and shows you the whole machine — so the 33 modules ahead are naming things you've already touched. Already run a bolt? Skip to M00; everything here is re-taught properly, track by track.</p>

<section class="block" style="padding-top:0">
    <h2>You already know this workflow</h2>
    <p>Remember being a junior dev with a good tech lead? You'd propose an approach and they'd say
    <em>"walk me through it first."</em> You'd hit something ambiguous and you knew not to guess — you'd
    walk over and ask. When they made a call, someone wrote it down so the next person didn't re-ask.
    And your code didn't ship until they'd read it.</p>
    <p><strong>AI-DLC is exactly that relationship, with the seats swapped.</strong> You're the tech lead.
    The AI is the junior — an absurdly fast one who has read all the docs and never gets bored — and the
    "methodology" is nothing more than that working agreement, written into files instead of carried in
    your head.</p>

    <p>Here's what that means in practice — one story, traced from the backlog to merged code, showing
    what exists at every step. No metaphors from here on.</p>
  </section>
<section class="block">
    <h2>From a Jira story to code</h2>

    <div class="artifact doc">
      <div class="artifact-name"><b>PA-1423</b><span class="eng">jira · story</span></div>
      <pre>As a nurse reviewer, I want requests that need nurse review
to show a distinct status, so I can tell what's actually
waiting on me.</pre>
    </div>

    <p>In your current world: sprint planning estimates it, you pick it up Wednesday, spend half a day
    reading code and half a day writing it, open a PR, wait for review, merge Friday. Here is the same
    story under AI-DLC.</p>

    <h3>Step 0 — done once per project, not per story</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>install the engine, write the rules file, commit it</span>
      <span class="w"><span class="tag ai">ai</span>nothing yet</span>
    </div>
    <p>On day one of the project — not day one of this story — someone commits the rules file. Notice
    it names where decisions will live; everything later hangs off that:</p>
    <div class="artifact doc">
      <div class="artifact-name"><b>CLAUDE.md</b><span class="eng">initial config — committed on day 1</span></div>
      <pre># Prior Auth Portal — API

- AUTO_APPROVE_THRESHOLD = 0.85 is clinical policy. The rule
  is >=. Never change it from a prompt.
- Plan first: numbered steps, files you will touch. STOP for
  my approval before editing anything.
- Tests first. Run npm test yourself; show the real output.
- If a decision is not derivable from this repo — ask. Never guess.
- Record every human decision in docs/decisions.md (create it
  if it does not exist), with reasoning and who decided. (D-00X)
- One unit of work per session. Write each one to docs/units/.</pre>
    </div>
    <p>The repo at this point: <strong>there is no <code>docs/</code> folder.</strong> The rules file declares where things will live, and the AI creates them the first time it has something to record — you'll see it at step 4. Beyond the engine itself, there is nothing to install. <em>(The shipped <code>prior-auth-api</code> repo shows the evolved file, with <code>@</code>-imports — M13 and M14 cover how these files physically become the engine's memory.)</em></p>

    <h3>Step 1 — you enter plan mode, then paste the story</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>turn plan mode on, paste the story</span>
      <span class="w"><span class="tag ai">ai</span>reads CLAUDE.md before your first keystroke</span>
    </div>
    <div class="artifact">
      <div class="artifact-name"><b>terminal</b><span class="eng"># Claude Code</span></div>
      <pre>cd prior-auth-api
claude
# press shift+tab until the status line reads "plan mode on"
# (or launch it that way: claude --permission-mode plan)
> PA-1423: nurses need requests waiting on nurse review to
> show a distinct status so they can tell what's theirs.</pre>
    </div>
    <p><strong>When:</strong> before you paste the story, any time the work is more than a trivial fix.
    <strong>Why:</strong> plan mode takes the write tools away from the model — "plan first, stop for my
    approval" stops being a rule it follows and becomes a switch you flipped. Your <code>CLAUDE.md</code>
    asks for plan-first anyway; plan mode makes it physically true.</p>
    <p>That is your entire input. You did not write a spec — you pasted the Jira story, more or less.</p>

    <h3>Step 2 — the AI answers with text, not code</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>wait (about a minute)</span>
      <span class="w"><span class="tag ai">ai</span>reads the codebase, decomposes, finds the gap</span>
      <span class="w"><span class="tag sys">disk</span><b>nothing written — <code>git status</code> is clean</b></span>
    </div>
    <p>It reads the codebase and the rules file, then prints:</p>
    <div class="artifact">
      <div class="artifact-name"><b>the AI's reply</b><span class="eng">a plan — no code yet</span></div>
      <pre>This fits in one sitting — no need to split it.

Plan:
 1. Add PENDING_NURSE_REVIEW to the AuthStatus enum
 2. Route below-threshold requests to it in
    DeterminationService
 3. Tests for both, plus the 0.85 boundary

Files I'll touch: auth-status.enum.ts,
                  determination.service.ts
Files I won't:    the scoring engine

One question before I start. The story covers new requests.
But an APPROVED request can be re-scored when new clinical
notes arrive. If it re-scores below threshold — does it go
to nurse review too, or does the approval stand? Nothing in
the repo answers this.</pre>
    </div>
    <p><strong>Nothing has happened to your code yet.</strong> This step replaces you spending Wednesday
    morning reading code and pinging the PO on Slack. The AI did the reading — and the question it
    couldn't answer surfaced in minutes, instead of being discovered mid-implementation.</p>

    <h3>Step 3 — you answer, in plain English</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>make the product decision, approve the plan</span>
      <span class="w"><span class="tag ai">ai</span>waits — write tools still locked</span>
    </div>
    <div class="artifact">
      <div class="artifact-name"><b>terminal</b></div>
      <pre>> Approvals stand. We never take back an approval on a
> re-score — open a new request instead. Plan approved, go.</pre>
    </div>
    <p>Ten seconds of typing — but that was a <em>product decision</em>, and you just made it before any
    code existed, instead of the AI (or a rushed developer) silently picking one.</p>
    <p>The "go" is not just words, either. Because you're in plan mode, Claude Code shows an explicit
    <em>approve this plan?</em> prompt — accepting it is what exits plan mode and hands the write tools
    back. That prompt is the checkpoint, made mechanical.</p>

    <h3>Step 4 — now, and only now, code gets generated</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>watch (or get coffee)</span>
      <span class="w"><span class="tag ai">ai</span>edits files, runs tests, fixes, re-runs</span>
    </div>
    <p><strong>The AI tool is a program that can edit files and run shell commands in your repo.</strong> When you said "go", your working tree started changing — no copy-paste, no chat window. Run <code>git status</code> mid-bolt:</p>
    <div class="artifact">
      <div class="artifact-name"><b>git status</b><span class="eng">mid-bolt — every write the AI made</span></div>
      <pre>modified:   src/determination/auth-status.enum.ts
modified:   src/determination/determination.service.ts
modified:   src/determination/determination.service.spec.ts  (+2 tests)
new file:   docs/units/UW-pa-1423.md
new file:   docs/decisions.md</pre>
    </div>
    <p><strong>This is the moment <code>docs/</code> is born.</strong> Nobody ran <code>mkdir</code> — the rules file said "create it if it doesn't exist," so the AI did, with its ordinary write tools. The convention came from a human, once; the files come from the AI, every bolt. Meanwhile it runs <code>npm test</code> itself, reads the failures, fixes, re-runs — you see the real runner output, not a claim about it.</p>

    <h3>Step 5 — you review a diff, like any PR</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>read every line, ask for changes or accept</span>
      <span class="w"><span class="tag ai">ai</span>presents the diff and the test output</span>
    </div>
    <div class="artifact">
      <div class="artifact-name"><b>the AI's reply</b></div>
      <pre>Done — 3 files changed, 6 tests passing (output above).</pre>
    </div>
    <p>You read the diff. It is small, because the plan was small. You ask for changes or you accept —
    the same code review you already do, moved earlier and made faster because you approved the shape of
    it back in step 3.</p>

    <h3>Step 6 — the decision gets written down</h3>
    <div class="who-row">
      <span class="w"><span class="tag you">you</span>supplied the decision and the reasoning (back at step 3)</span>
      <span class="w"><span class="tag ai">ai</span>writes it up, in the format the rules file prescribed</span>
    </div>
    <p>Here is the actual entry the AI wrote — your ten seconds of typing from step 3, expanded into the
    record the rules file asked for:</p>
    <div class="artifact doc">
      <div class="artifact-name"><b>docs/decisions.md</b><span class="eng">written by the AI · decided by you</span></div>
      <pre>## D-004 — Re-scores never reopen approvals

Decision: a below-threshold re-score on an APPROVED request
opens a NEW AuthRequest. The existing approval stands.

Why: once we've told a provider yes, taking it back on a
re-score is a member-care harm — they may already be
scheduled. A new request gets fresh review without
withdrawing a promise.

Decided by: you, during PA-1423. Not inferred.</pre>
    </div>
    
    <p>Why all this writing? Because the AI has no memory between sessions. Next month, when someone asks
    it to build the re-scoring feature, it reads <code>docs/decisions.md</code> and already knows D-004 —
    instead of asking again, or guessing differently. That is all "context memory" means.</p>

    <p>You commit. Story done — about an hour, not three days. The repo after one bolt:</p>
    <div class="artifact doc">
      <div class="artifact-name"><b>the repo, after</b><span class="eng">human-authored vs AI-authored</span></div>
      <pre>CLAUDE.md                     you wrote it, day 1 (unchanged today)
docs/                         ← born this bolt, created by the AI
  decisions.md                AI wrote it · you decided D-004
  units/UW-pa-1423.md         AI wrote it · team approved it
src/determination/…           AI wrote it · you read every line</pre>
    </div>

    <h3>What actually changed vs. your normal week</h3>
    <div class="table-scroll">
      <table class="bridge">
        <thead><tr><th></th><th>Normal</th><th>AI-DLC</th></tr></thead>
        <tbody>
          <tr><td>Reading the codebase to plan</td><td>you — hours</td><td><b>AI — minutes</b></td></tr>
          <tr><td>Finding the ambiguity in the story</td><td>mid-implementation, if you're lucky</td><td><b>before any code, every time</b></td></tr>
          <tr><td>Typing the code and tests</td><td>you</td><td><b>AI, editing your repo directly</b></td></tr>
          <tr><td>Product decisions</td><td>sometimes made silently in code</td><td><b>made by you, explicitly, and written down</b></td></tr>
          <tr><td>Review</td><td>once, after days of work</td><td><b>twice: the plan (2 min) + the diff (15 min)</b></td></tr>
        </tbody>
      </table>
    </div>

    <p>And the course's vocabulary maps onto this one trace: the whole cycle is a <strong>bolt</strong>,
    the one-sitting chunk is a <strong>unit of work</strong>, the stops at steps 3 and 5 are
    <strong>checkpoints</strong>, the notes file is <strong>context memory</strong>, and the rules file
    is <strong>steering</strong>. That is genuinely all of it — this loop, story after story, with the
    discipline to never skip step 2's questions, step 5's review, or step 6's write-down.</p>
  </section>
<section class="block">
    <h2>Do people sit on a call all day?</h2>
    <p>Fair worry — "Mob Elaboration" and "Mob Construction" sound like a standing meeting. The reality
    is the opposite of a sprint's ceremony load: AI-DLC <strong>concentrates</strong> synchronous time
    into two short moments per bolt, and the files buy everything between back as offline work.</p>
    <p>The loop below plays one bolt in four scenes — the three AI-DLC phases every bolt has, plus the close:</p>
    <ol>
      <li><strong>Inception — sync, ~30 min.</strong> Mob Elaboration: the team and the AI turn the ticket into a unit of work. The AI's open question becomes a recorded decision before any code exists.</li>
      <li><strong>Construction — async, hours.</strong> The engine builds from the files while everyone works at their own desk. Mid-build questions are answered by the decision log, not a meeting.</li>
      <li><strong>Construction, the checkpoint — sync, ~15 min.</strong> The decider reads the diff and signs off, or sends it back.</li>
      <li><strong>Operations — the close.</strong> Ship, record what was decided, clear. The next bolt starts already knowing it.</li>
    </ol>

    <p>The rule: <strong>you sit together when a decision is being made; you work offline when the
    decisions are already written.</strong> The middle of the loop is the point — a question comes up
    mid-build and <em>nobody gets pinged</em>, because the answer is already in the decision log with
    its reasoning. Every recorded decision is a meeting that never has to happen again.</p>

    <div class="table-scroll">

        <tbody><tr>
          <td>Mob Elaboration opens the bolt; the checkpoint closes construction. Short, because the
          decision-owners are in the room and the AI has already drafted the artifacts under
          discussion.</td>
          <td>Everything between. The engine executes from files. Questions the log already answers
          interrupt no one; a genuinely new, non-blocking question gets parked in the unit of work and
          answered on the ticket. You convene early only when it blocks the whole unit.</td>
        </tr></tbody>
      </table>
    </div>

    <p>What each of the seven does all day: the five developers run their lanes — approve plans, read

<table class="bridge">
  <thead><tr><th>Layer</th><th>What you actually do</th><th>Why</th></tr></thead>
  <tbody>
    <tr><td>The methodology</td><td><b>Nothing.</b> It is already in the repos: <code>CLAUDE.md</code>, <code>AGENTS.md</code>, <code>docs/decisions.md</code>, <code>docs/units/</code></td><td>Text files plus human attention. There is no install step and no daemon.</td></tr>
    <tr><td>An engine (pick one, install globally)</td><td><code>npm i -g @anthropic-ai/claude-code</code> <b>or</b> <code>npm i -g @openai/codex</code></td><td>This is the thing that reads files, writes code, and runs your commands.</td></tr>
    <tr><td>Each repo's own tooling</td><td><code>npm install</code> inside <code>prior-auth-api</code> and inside <code>prior-auth-web</code></td><td>Ordinary app dependencies — TypeScript, Jest, Vite, Vitest. A Python shop would have pytest here and the method would be identical.</td></tr>
  </tbody>
</table>
<div class="callout"><b>No AWS account is required.</b> AI-DLC is AWS's open-source methodology, not an AWS service. Nothing in these repos calls a cloud API, a database, or a network endpoint at runtime — the whole course runs offline apart from installing packages and talking to your engine.</div>

<p class="hook">The Prior Auth Portal team has a problem every healthcare engineering group recognizes: authorization requests take days to process, members wait, providers call, and the backlog of platform work is measured in quarters. Leadership has approved an experiment — rebuild the intake-to-determination flow using AWS's AI-Driven Development Lifecycle, with AI as a teammate rather than an autocomplete. You are on that team. This course is the experiment.</p>

<h2>What this course teaches</h2>
<p>AI-DLC is AWS's open-source methodology for building software with AI as a first-class collaborator. It is not a tool. It is a way of working: AI drafts the plans, asks the clarifying questions, and writes most of the code — while humans validate every consequential decision. The methodology rejects two familiar anti-patterns: <strong>AI-managed</strong> development (hand the AI a wish and hope) and <strong>AI-assisted</strong> development (AI as a fancy autocomplete on narrow tasks). Both leave most of the value on the table.</p>
<p>Because AI-DLC is a methodology, it does not care which agentic engine executes it. AWS demonstrates it with Amazon Q Developer and Kiro; this course runs it on <strong>Claude Code</strong> and <strong>OpenAI Codex CLI</strong> — two engines, one operating protocol. Every hands-on lab gives you both variants, and by Track 5 you will be able to choose between them deliberately.</p>

<h2>The three phases, at a glance</h2>
<p>AI-DLC organizes work into three phases. <strong>Inception</strong> turns business intent into requirements, stories, and units of work — with the whole team validating the AI's proposals in a ritual called <strong>Mob Elaboration</strong>. <strong>Construction</strong> turns units of work into architecture, plans, code, and tests, with human checkpoints at every consequential decision. <strong>Operations</strong> ships the result and — critically — preserves the context so the next cycle starts smarter. Work moves in <strong>bolts</strong>: cycles measured in hours or days, not the weeks of a sprint.</p>

<p class="hook">The Prior Auth Portal isn't the org's first AI experiment. Last year a platform team pointed an autonomous agent at "build a claims triage bot" and let it run; the demo was dazzling, but compliance found it had approved requests no nurse ever saw, and nobody could explain the routing logic well enough to fix it. Meanwhile the intake team adopted AI code completion and measured a real, honest 12% speedup — and their two-quarter backlog is still two quarters long. Both teams "use AI." Neither is transformed. Before your team starts the portal rebuild, you need the vocabulary for why both approaches stall — because you will be pitched both, repeatedly.</p>

<h2>Anti-pattern one: AI-managed</h2>
<p>The AI-managed pattern expects AI to build systems autonomously: state the intent, walk away, collect the software. It fails for a structural reason, not a model-quality reason. Every non-trivial system embeds dozens of consequential decisions — thresholds, orderings, exception paths — and an unsupervised agent resolves each one by assumption. Wrong assumptions don't announce themselves; they compound silently into an architecture nobody chose.</p>
<p>The claims-triage bot assumed a 0.70 score was safe to system-approve because nothing told it otherwise — the real rule routes anything below <code>AUTO_APPROVE_THRESHOLD (0.85)</code> to the nurse review queue. In a regulated domain that isn't a bug, it's a compliance event: a <code>Determination</code> with no accountable human behind it. Output no one can review is output no one can own. <strong>Unreviewable is unshippable.</strong> The tell for this anti-pattern is the phrase "the AI will handle it" — accountability has left the room.</p>

<h2>Anti-pattern two: AI-assisted</h2>
<p>The opposite reflex is to keep AI on a short leash: code completion, snippets, test stubs, commit messages. This works — honestly, measurably — and then it plateaus at roughly 10–15%, because typing speed was never the bottleneck. The Prior Auth backlog is measured in quarters because of requirements churn, cross-team handoffs, and rework discovered late, and an autocomplete never touches any of that.</p>
<p>Watch the intake developer at work: the AI suggests a plausible <code>if</code> block around <code>memberId</code>, and the human then spends forty minutes re-deriving the actual rule — an eligible <code>Member</code> and an in-network <code>Provider</code> must both check out before <code>ClinicalCriteria</code> scoring runs. The AI was never shown the intent, so every gain is local to the keystroke. The tell here: the AI sees fragments, never the problem.</p>

<aside class="analogy">

<p class="hook">Monday, 9:04 am, the portal rebuild's first working session. The AI has already read the domain brief and posted a proposed plan for the intake slice — and three questions: does an <code>AuthRequest</code> for an ineligible <code>Member</code> get rejected at intake or logged for outreach? Are urgent requests a separate intake path or a priority flag? And who may change <code>AUTO_APPROVE_THRESHOLD</code>? The nurse-review SME laughs: "It's asking better questions than our last vendor." The architect is warier: "If it drafts the plan, who's actually deciding?" That question — who decides, and exactly when — is the whole of AI-DLC's two principles, and this module answers it.</p>

<h2>Dimension one: AI-powered execution with human oversight</h2>
<p>M01 left an empty corner on the map; AI-DLC's first dimension names how to occupy it. The inversion is total: the AI drives the work end to end — it drafts the requirements, the plans, the architecture, the code, the tests — and humans steer at defined moments. This is not AI helping humans type faster. It is humans supervising an AI that executes.</p>
<p>Supervision runs on a three-move protocol. The AI <strong>plans</strong>: every proposal arrives complete and reviewable, not as a stream of edits you reconstruct afterwards. The AI <strong>asks</strong>: where the intent is ambiguous, it surfaces a clarifying question instead of picking a default — the exact move M01's triage bot skipped at 0.70. And the AI <strong>defers</strong>: decisions it recognizes as critical are queued for a human with a name, never resolved by assumption.</p>

<h2>Which decisions are critical?</h2>
<p>"Defers critical decisions" only works if the team can say what critical means before the work starts. Three heuristics do most of the sorting: <strong>blast radius</strong> (who is affected if this is wrong — a file, a team, a member awaiting care?), <strong>reversibility</strong> (a renamed DTO costs a commit; a mis-set threshold costs an audit), and <strong>regulatory exposure</strong> (anything touching PHI, determinations, or who-may-approve is policy, not code). Run the portal's decisions through those filters and the sorting is rarely controversial:</p>

  </tbody>

<p>Everything below the human line, the AI proposes and moves on. Calibrating how much ceremony a given change deserves has a name in AI-DLC — <strong>adaptive rigor</strong> — and gets its own module in Track 3.</p>

<h2>Dimension two: dynamic team collaboration</h2>
<p>The second dimension is what the humans do between checkpoints. In the handoff model, work flows ticket to analyst to developer to QA, and each hop waits in a queue; coordination cost is tolerable because construction is the slow part. AI-DLC breaks that assumption: once the AI compresses execution from weeks to hours, <em>coordination</em> becomes the tempo-setter — a decision that waits three days now stalls the whole bolt.</p>
<p>So the team reorganizes around decision moments instead of handoffs. When the AI surfaces the ineligible-Member question, whoever that decision needs — the PO, the architect, the nurse SME — convenes, decides, and disperses. Nobody owns a stage; everybody owns the decisions their expertise touches. The whole team validating AI proposals together has two structured forms — <strong>Mob Elaboration</strong> during Inception and <strong>Mob Construction</strong> during Construction — and M03 defines both, along with the rest of the new vocabulary.</p>

<h2>Units of work: the sizing rule</h2>
<p>A <strong>unit of work</strong> is the smallest slice of the system sized for exactly one AI construction loop ending in exactly one <em>approval gate</em> — and small enough that the humans at that gate can honestly understand every line. Decisions still happen inside the loop: the AI defers a question mid-construction, a named human answers in minutes, the loop continues. What has to be singular is the gate that closes the unit. That gate is the unit of measure: if a slice needs two sign-offs to be safe, split it; if it can't be reviewed on its own, merge it or re-slice.</p>
<p>M00's Inception transcript stopped one level above the rule: its UW-1 intake, UW-2 <code>ClinicalCriteria</code> scoring, UW-3 review queue, and UW-4 <code>Determination</code> records are epic-sized, and each becomes a capstone bolt in Track 6. Apply the sizing rule to the first of them and the intake epic splits again — UW-1a schema validation, UW-1b eligibility, UW-1c routing handoff. Each of <em>those</em> is one loop, one decider, one reviewable diff.</p>

<p>Inception starts from <strong>business intent</strong>, and the sentence above is a good one for three reasons: it is <em>outcome-shaped</em> (cut turnaround — not "build a dashboard"), <em>measurable</em> (4.2 days → 24 hours), and <em>constraint-bearing</em> (nurse review is non-negotiable, right there in the ask). A feature list is the failure mode: "build a status dashboard with filters" smuggles the design into the request and leaves the actual outcome unstated.</p>

<aside class="analogy">
<p>Before a single crew was scheduled, the design desk spent a day on the empty lot — measuring setbacks, tracking the sun, testing where water pools after rain. The blueprints arrived two mornings later, complete — and covered in small red flags: "septic or sewer?" "deck faces the lake or the morning sun?" "the county wants the well 30 metres from the drain field — confirm?" Meera and Ravi answered every flag; the answers went into the build book; and only then did the desk cut the drawings into numbered work packages a crew could take one at a time.</p>

<h2>Question-driven elaboration</h2>
<p>The pipeline's quality engine is the questions. At every stage the AI attaches them where the intent is silent, and four kinds recur. <strong>Policy:</strong> a request auto-approved at 0.91 re-scores at 0.62 — does the determination stand? <strong>Edge case:</strong> the <code>Member</code> is eligible but the <code>Provider</code> is out-of-network — what happens? <strong>Data:</strong> where does eligibility truth live, and how stale may it be? <strong>Integration:</strong> does the portal write determinations back to the claims system, or only read?</p>
<p>Answers are never just chat. Each becomes a recorded constraint — a line in <code>decisions.md</code> that downstream artifacts must trace to. And note the inverted quality signal: an Inception that ends with <em>zero</em> deferred questions is not a compliment to the intent. It means the AI assumed — M01's first anti-pattern wearing a process costume.</p>

<p class="hook">Wednesday, 10:00. One conference room, six people, and the AI's Inception artifacts on the big screen: nine requirements, three stories, six open questions on the intake epic. The meeting invite says 50 minutes, and the facilitator opens with the only rule that matters: "We are here to decide, not to discuss. Anything we can't decide in three minutes gets an owner and a date." By 10:50 the intake epic will either have validated units of work with acceptance criteria — or the team will have discovered that Mob Elaboration is just backlog grooming with better slides. The difference is technique, and technique is learnable.</p>

<h2>The room and the roles</h2>
<p>Attendance is not optional and not open: the room needs <strong>every decision-owner the artifacts touch</strong>. For the intake epic that means the PO (policy calls), the architect (integration calls), the nurse SME (clinical semantics), and the engineers who will take the bolts. The AI attends as <em>presenter</em>, not stenographer — everything on screen is its own draft, and it fields questions about its reasoning the way any author would.</p>
<p>The facilitator protects exactly two things: the timebox, and the decision rule — three minutes of discussion buys a decision or a parking, never a longer discussion. And "validation" has a precise meaning: every artifact gets an explicit disposition — approved, amended, or rejected. Silence is not approval; an artifact nobody spoke about is an artifact nobody validated.</p>

<h2>The clarifying-question loop</h2>
<p>The heart of the session is the loop, run <strong>one question at a time</strong>. Five stages: the AI <strong>asks</strong> — with its best guess attached and a sentence on why it won't just pick ("I'd default to async queue writes, but the guardrail makes this a patient-safety ordering question"). <strong>Bounded discussion</strong> — three minutes. A <strong>named human decides</strong> — not the room's vibe; a person whose call it is. The AI <strong>restates</strong> the decision as a constraint. It's <strong>recorded</strong> in <code>decisions.md</code> before the next question opens.</p>
<p>Two moments make or break the ritual. <em>Disagreement</em> — the nurse SME wants urgent requests phoned to the queue lead, the PO wants no side channels — is the room working correctly: the facilitator's move is not consensus but jurisdiction, "whose call is this?" <em>Unanswerable questions</em> — nobody in the room knows where the compliance store lives — get parked as a promise: an owner, a date, and the unit of work they block. A parked question blocking bolt 1 reorders the backlog; that's the parking lot doing its job.</p>
<p>Not everything the room parks is a <em>question</em>. Some units simply feed others — the review-queue story consumes the score the scoring story produces — and that dependency is a parking-lot entry too, with a different owner: not a person and a date, but <strong>the producing unit and the interface between them</strong>. Name that interface here, in acceptance-criterion form, while the decomposition is still soft and cheap to change. Construction then chooses how to honor it — serialise the units, or pin the interface and stub it so both build in parallel (M18). Detected in the room it's one line in the log; discovered mid-bolt it's a re-plan.</p>

<h2>Acceptance criteria that hold</h2>
<p>The session's output contract is acceptance criteria, and three tests separate criteria that hold from criteria that decorate. <strong>Testable:</strong> a machine or a reviewer can verify it without interpretation. <strong>Traceable:</strong> it names the requirement it serves. <strong>Edge-bearing:</strong> it encodes the known edges — below-threshold routing, the ineligible <code>Member</code>, the out-of-network <code>Provider</code> — instead of leaving them to Construction's imagination.</p>
<p>Before: "intake validates requests properly." After, for the intake story: <em>(1) an <code>AuthRequest</code> missing schema-required fields is rejected with a field-level error (R1); (2) an ineligible Member is rejected and one outreach log entry exists (R3); (3) an eligible Member with an out-of-network Provider routes to nurse review, never auto-approve (R4).</em> Three clauses, each verifiable, each naming its requirement. These criteria are the contract M07's plans and tests will trace to — weak criteria here is rework there.</p>

<h2>Architecture and plans before code</h2>
<p>For each unit of work, the AI proposes two artifacts before any implementation. The <strong>architecture proposal</strong> is small-scale and reviewable — where validation lives, what it depends on, how data flows — not a cathedral document; it answers "will this placement haunt us?" in a page. The <strong>implementation plan</strong> is ordered steps, each small enough to verify, and it carries its own deferred decisions inline: <code>step 6 — BLOCKED (HUMAN): outreach-log format</code>. M02's protocol didn't stop at Inception; it runs inside Construction too.</p>
<p><strong>Plan approval is checkpoint #1</strong>, and it exists because a plan is the cheap place to be wrong: redirecting a plan costs a sentence, redirecting a diff costs a rebuild. "It could have just written the code" is the AI-managed reflex in disguise — you'd get code, and you'd get it before any human had seen the decisions buried in it.</p>

<h2>Code and tests arrive together</h2>
<p>One construction loop produces implementation <em>and</em> tests, and the tests trace to acceptance criteria <strong>by name</strong>: AC-2 ("ineligible <code>Member</code> → reject + one outreach log entry") maps to a specific plan step and lands as <code>writes_outreach_log_once</code>. That's auditable coverage — a reviewer can walk criterion → step → test in seconds — not coverage theater, where a percentage hides which promises are actually tested.</p>

<p class="hook">Friday, 13:00. UW-1a's increment is up on the screen: 14 files, 312 lines, tests green. The AI opens the way it always must — deviations first: "Two departures from the approved plan: I added a procedureCode format check that wasn't in step 1, and the outreach log writes through a buffer, not directly." The architect points at a line: "Explain the buffer flush condition." Thirty seconds later the room knows something subtle about failure ordering that no one would have caught scrolling a diff alone at 4 pm. That's Mob Construction: not a meeting about code, but the moment the team either understands its system or merges a stranger into it.</p>

<h2>The increment review, as a ritual</h2>
<p>The structure deliberately mirrors M06: one increment at a time, and the author presents its own work. The AI walks the increment <em>against the approved plan</em> in a fixed order — <strong>deviations first</strong>, then the criteria walk (fig 7.2's arrows, criterion by criterion), then open floor. Deviations lead because they're where the risk lives; burying them after twenty minutes of matching-the-plan is how surprises ship.</p>
<p>The room follows M03's table: the named decider must attend, and the engineers who'll build adjacent units of work attend because this diff is their tomorrow's context. One reframe matters: deviations aren't sins — <em>unexplained</em> deviations are. "I added a procedureCode format check, because the schema allows strings the payer will reject downstream" is the AI exercising judgment transparently; the review exists to decide whether that judgment stands.</p>

<h2>Understand every line</h2>
<p>The discipline has a one-sentence form: <strong>nothing merges that no human present can explain.</strong> In regulated code this is not culture, it's survival — "the AI wrote it" is not an answer an auditor, or a plaintiff's attorney, accepts about a <code>Determination</code> path.</p>
<p>Three techniques make it enforceable at speed. The <strong>walk-through</strong>: the AI explains its own diff, humans interrupt at will. <strong>Spot-explain sampling</strong>: pick three random hunks; a human — not the AI — explains them back to the room. <strong>Ask-me-anything</strong>: any line, and a plain-words answer inside thirty seconds, or the increment isn't ready. All three stay honest for one reason: M03's sizing rule. Three hundred lines can be understood in a room; 4,200 is theater no matter how sincere the ritual.</p>

<aside class="analogy">
<p>The evening walkthrough had rules Meera only noticed after a week. The foreman led, always starting with what differed from the drawings — "we moved this junction box a hand-width; here's why" — before showing off what matched. Ravi could stop at any stud and ask "why is this doubled?" and get an answer in plain words, or the package didn't get signed. One evening the answer to a window header was a shrug, and the package went back — not with "do better," but with a decision: "header per drawing 14, or bring me the load calculation." The owners never picked up a hammer. They signed, or they sent back with instructions.</p>
<span class="maps-to">maps to → <b>deviations shown first</b> = the AI presents departures from plan · <b>any stud, plain words</b> = understand every line · <b>the shrug</b> = an unexplained diff fails review · <b>"drawing 14 or the load calc"</b> = send-back with a decision</span>
</aside>

<h2>Gates and send-backs</h2>
<p>Human attention is the scarcest resource in the room, so the gate stack spends it last. <strong>Mechanical gates run first</strong> — tests green, lint clean, build passes — and an increment that fails them never reaches human eyes; machines don't get bored and don't get charmed. <strong>Human gates verify what machines can't:</strong> are the criteria actually covered, does the diff honor <code>decisions.md</code>, is every line explainable? (Wiring the mechanical gates into the engine itself — hooks, permission models — is M17's business.)</p>
<p>And there are exactly two exits. <strong>Sign-off</strong>: merged, increment summary written to context memory. <strong>Send-back with a decision</strong>: "extract the flush threshold to config, name it, justify the default" converges in one narrow re-plan; "clean this up" loops forever. The send-back is itself recorded — the next bolt inherits not just the code but the taste it was corrected toward.</p>

<p class="hook">Monday of week two, 15:10. UW-1a is signed off, and the temptation is to call bolt 1 done and grab UW-1b. The ops engineer blocks the doorway: "Done means deployed, observed, and written down." Forty minutes later staging is running the increment, one alert exists that would fire if a below-threshold request ever skipped the queue, and a two-page close-out sits in docs/ — including the one thing nobody predicted (the outreach buffer never once hit its 50-entry flush). Tuesday's Mob Elaboration for bolt 2 will open by reading that file. This is the phase teams skip, and it's the phase that makes the next bolt faster than this one.</p>

<h2>Ship the bolt</h2>
<p>Operations opens with a rule inherited from everything before it: deployment artifacts are <em>artifacts</em> — the AI generates the build output, the config delta, the migration steps, and the runbook delta, and humans review them the way they reviewed the plan. Improvised deploys are how a disciplined bolt dies in its last hour.</p>
<p>The deploy sign-off is a checkpoint you've already met: it sat in M02's decision table as the <strong>exposure boundary</strong> — the first place real PHI could flow, so a human decides, every time. And notice what bolt sizing does here: an increment of one unit of work makes the deploy <em>boring</em>, which is the goal. A team batching six bolts into a "release" is the old tempo smuggling itself back in.</p>

<h2>Observe with intent</h2>
<p>Observability in AI-DLC traces to acceptance criteria exactly the way tests do. Story S2 promised a queue entry within 60 seconds of scoring (M05); Operations turns that promise into an alert that fires when it breaks — coverage for runtime, auditable the same way fig 7.2's arrows were. The guardrail gets the loudest wire: any <code>AuthRequest</code> scoring below <code>AUTO_APPROVE_THRESHOLD (0.85)</code> without a queue entry is an alarm, not a log line.</p>
<p>This is M04's "explicit errors" enabler, operationalized — fail loud, log every score immutably, never be silently wrong. And treat what you observe as <em>input</em>: the outreach buffer that never reached its 50-entry flush isn't trivia, it's design feedback with bolt 2's name on it.</p>

<p>The first wing was ready, but the firm wouldn't hand over keys after the last walkthrough. First the county inspector signed the occupancy permit; then the crew chief walked Meera and Ravi through the wing one last time — not the construction, the <em>living</em>: where the water shutoff is, which breaker feeds the kitchen, what the furnace sounds like when it's healthy. That week they noticed a draft under the mudroom door and logged it in the build book instead of just shimming it. When the design desk drafted the second wing that Friday, its first question referenced the draft: "north-facing doors get storm rails — confirm?"</p>

<h2>Preserve context: the sequential knowledge handoff</h2>
<p>The bolt closes with a two-page artifact, written by the AI and validated by the humans who lived the bolt: <strong>what shipped · decisions made (with links) · deviations and why · operational learnings · open questions for bolt N+1</strong>. Every section already exists somewhere in the chain — the close-out is curation, not archaeology, which is why it costs forty minutes and not an afternoon.</p>

<p class="hook">Three requests hit the portal team's queue the same morning. One: the outreach log message says "elligible" — fix the typo. Two: clinical policy wants <code>AUTO_APPROVE_THRESHOLD</code> moved to 0.82 for imaging requests. Three: build the <code>ClinicalCriteria</code> scoring engine — bolt 2's centerpiece. Running the typo through full Inception with a Mob Elaboration would be theater; running the threshold change without one would be malpractice. Same team, same day, three different ceremonies — and the skill of this module is saying <em>which</em> and <em>why</em> out loud, before the work starts, instead of letting habit or hurry decide.</p>

<h2>Rigor is a dial, not a switch</h2>
<p>Everything Track 2 taught is the <strong>maximum</strong> ceremony, not the default one. <strong>Adaptive rigor</strong> selects which stages a change actually needs. Both failure directions are real: over-ceremony taxes every small change until the team routes around the process entirely — the shadow queue of "we'll just slip it in" — while under-ceremony is M01's first anti-pattern returning with a schedule excuse.</p>
<p>The dial's inputs extend M02's criticality heuristics. To <em>blast radius</em>, <em>reversibility</em>, and <em>regulatory exposure</em>, add two: <strong>novelty</strong> (has this shape of change been done here before? a known shape rides established rails) and <strong>size</strong> (more surface, more places to be wrong). One invariant holds at every setting: <strong>a human sets the dial.</strong> The AI proposes a rigor level with its reasons; approving the skip is itself a checkpoint, and the skip is logged. An unlogged skip is how "just a config change" becomes an incident review.</p>

<h2>Greenfield or brownfield: read the ground first</h2>
<p>Before proposing a process, the AI reads the ground. <strong>Greenfield</strong> — empty repo, no conventions, no users — defaults to scaffold-and-go: full Inception, establish the steering file, build. <strong>Brownfield</strong> — an existing system with embedded decisions — defaults to <em>survey before touching</em>: the semantic context building that M12 teaches. Detection signals are ordinary and checkable: repo contents, test presence and shape, steering file existence, commit history density.</p>
<p>The misdetection cost is asymmetric. Treating greenfield as brownfield wastes a survey. Treating brownfield as greenfield bulldozes constraints nobody restated — the 12-year-old eligibility system the portal integrates with has opinions the code never wrote down. Which is the honest Prior Auth answer: the portal is greenfield, its integrations are not, and <strong>rigor follows the riskier edge</strong> of any mixed change.</p>

<aside class="analogy">
<p>With the first wing occupied, Meera asked the design desk about two backyard ideas: a gazebo, and a boathouse on the waterline. For the gazebo the desk shrugged happily — "no permit needed; a crew sketches it Tuesday, builds it Wednesday, you walk it Thursday." For the boathouse the same desk reached for the full folder: shoreline setbacks, an anchoring survey, the inspector's wet-stamp, two walkthroughs. Ravi laughed that one was "just a shed with opinions." The desk didn't laugh: "The gazebo can fall over and embarrass us. The boathouse can slide into the lake." Same firm, two ceremonies — chosen out loud, and written in the build book.</p>
<span class="maps-to">maps to → <b>gazebo vs boathouse</b> = rigor scaled to blast radius, not size · <b>"chosen out loud"</b> = the AI proposes a rigor level, a human approves it · <b>the full folder</b> = Track 2's pipeline as the ceiling · <b>written in the build book</b> = skip decisions are logged</span>
</aside>

<h2>Stage selection, worked</h2>
<p>Run the morning's three requests through the dial. The <strong>typo</strong>: reversible in seconds, no behavior change, zero exposure — construction loop plus mechanical gates, one human disposition batched at day's end. No Inception; a Mob Elaboration here would be theater. The <strong>threshold change</strong>: a one-line diff that is a <em>clinical policy decision</em> — member-facing, regulator-visible, irreversible in audit terms. Maximum rigor despite minimum size: the policy owner decides, a Mob Elaboration question confirms scope (imaging only?), deploy waits at the exposure boundary, and the audit note is part of the increment. <strong>The scoring engine</strong>: novel, large, regulated — the full Track 2 pipeline, every stage, no debate.</p>
<p>The lesson the threshold change teaches is the module's core: <strong>risk does not equal diff size.</strong> And two things never leave the stage list at any setting: the mechanical gates (they're free — M08), and one named human disposition per change, however small.</p>

<p class="hook">The compliance officer asks the question every regulated team eventually faces: "Where is your SDLC documented, and how do I know the team actually follows it?" The old answer was a wiki page dated three reorgs ago. The portal team's answer is a folder of stage definitions — plain text files stating what each stage takes in, produces, and requires before exit — plus per-bolt logs showing which stages ran and who signed each exit. The officer reads the "deploy sign-off" stage, then bolt 1's close-out, and checks them against each other in four minutes. A process that is text can be audited, executed, and improved. A process that is habit can only be believed.</p>

<h2>A workflow you can read</h2>
<p>AI-DLC ships as an <strong>open-source workflow definition</strong>: the stages, their sequencing options, and the heuristics for including them are published files, not folklore. That design choice has three consequences worth naming. <strong>Engines execute it</strong> — Claude Code and Codex read the same stage text, which is half of how this course keeps its two engines interchangeable. <strong>Auditors verify it</strong> — the compliance officer's four-minute check was stage exit criteria against bolt 1's log. <strong>Teams diff it</strong> — a process change is a reviewable text change with a rationale and a date, not a memo that evaporates.</p>
<p>Recognize the pattern: this is the steering-file idea operating at methodology scale. The process itself lives in context memory, alongside the decisions it produced.</p>

<h2>Anatomy of a stage</h2>
<p>A stage definition is six fields: <strong>purpose · trigger heuristic · inputs · activities · outputs · exit criteria.</strong> The trigger heuristic is what M10's dial actually reads — "include when brownfield detected," "include for behavior-change class or above." The exit criterion names what must exist, and who signs, before the stage closes.</p>
<p>Read two from the standard library. <em>Semantic survey</em> — trigger: brownfield detected; output: a semantic map of the affected estate; exit: map validated by an engineer who knows the system (the whole of M12). <em>Mob Elaboration</em> — trigger: behavior-change class or above; output: approved units of work plus recorded constraints; exit: every artifact dispositioned (M06's rule). The load-bearing field is always the exit: <strong>a stage without a checkable exit is a meeting, not a stage.</strong></p>

<aside class="analogy">
<p>In the site office, Ravi finally noticed the laminated sheet every crew consulted: the firm's playbook — every stage it knew how to run, from "anchoring survey" to "wet-stamp inspection," each with one line for when it applies and one for what counts as done. The gazebo's checklist had used four stages; the boathouse, eleven. After the boathouse, the desk added a new card — "ice-load check: any structure on the waterline, signed by the marine engineer" — and pinned the date to it. The playbook wasn't a binder nobody read. It was short, posted, and it grew one earned card at a time.</p>
<span class="maps-to">maps to → <b>the laminated sheet</b> = the open-source stage library · <b>one line for when it applies</b> = trigger heuristics (M10's dial reads them) · <b>what counts as done</b> = exit criteria · <b>the dated ice-load card</b> = extending the library by reviewed change</span>
</aside>

<h2>Extending the library</h2>
<p>Org-specific needs <strong>extend</strong> the library; they never fork it. The portal team's addition is a <em>PHI review</em> stage — trigger: any change in the guardrail-or-PHI class from M10's policy; outputs: an evidence pack (the decision record, the threshold audit note, an access-scope diff); exit: the compliance owner signs. It sits in the same folder as the standard stages, in the same six-field format, and both engines pick it up the same way.</p>
<p>Stage definitions are versioned like code. Tightening a trigger heuristic is a reviewed diff with a rationale — the process improves by PR. And one restraint keeps the library honest: <strong>every new stage must earn its trigger.</strong> A library that doubles every quarter is process theater coming back with better formatting; the question for each proposed card is "which real change class needs this, and what checkable thing does it produce?"</p>

<p class="hook">Priya's answer finally arrives, and it's worse than the parked question implied: member eligibility lives in a 12-year-old system whose nightly cache means data can be 24 hours stale, whose <code>E4</code> flag means "retroactively terminated — treat as ineligible for new auths," and whose API returns <code>200 OK</code> with an empty body when a member is unknown. None of that is written anywhere. It lives in three engineers' heads, one of whom retires in May. Bolt 2's scoring engine has to integrate with this — and an AI reading raw source would see the <code>E4</code> check as three characters of string comparison, not as a decision with a member's care attached. Before any crew touches the cottage, someone has to survey the cottage.</p>

<h2>Why brownfield needs a survey</h2>
<p>Every system that has survived a decade embeds decisions its code never states: flag semantics, timing assumptions, conventions like "empty body means unknown member — don't retry." The code <em>enforces</em> these decisions without <em>expressing</em> them, which is exactly the trap for an AI: it reads syntax fluently and meaning not at all. The failure mode is a syntactically perfect change that violates an invariant nobody restated — M10's asymmetry, now with a member's care attached.</p>
<p>So brownfield's default is <strong>survey before touching</strong> — M11's semantic-survey stage, run for real. The division of labor is the usual one: the AI drafts the map from code, commit history, and configs — it can read all 480,000 lines and notice that six call sites treat <code>E4</code> specially. What it cannot do is know <em>why</em>. Humans confirm what the AI can only suspect.</p>

<h2>The semantic map</h2>
<p>The survey's output is a short document with four sections. <strong>Entities</strong> — with their real meanings, not their schemas ("Member.flags is a history, not a state"). <strong>Flows</strong> — who calls what, when, including the 02:00 cron nobody mentions. <strong>Invariants</strong> — what must stay true across any change. <strong>Flagged unknowns</strong> — suspected constraints awaiting a human yes or no.</p>
<p>The flagging discipline is the map's integrity. The AI writes "E4 handling suggests retro-termination — CONFIRM," never asserting what it inferred; a confirmed line carries its confirmer's name, which is how "confirmed: J. Ortiz" becomes citable context for every future bolt. And the stage's exit criterion (M11) does quiet succession planning: the retiring engineer's knowledge becomes an artifact this month, not a eulogy in May.</p>

<aside class="analogy">
<p>The lake cottage came with the lot — eighty years old, three previous owners, no drawings. Before any crew touched it, the firm sent a surveyor who spent two days inside and produced eleven pages, not eight hundred photos: which walls bear load (one looks decorative and isn't), where the 1963 wiring actually runs, which floor joist was sistered and why that matters for the new kitchen island. Two items wore red tags — "chimney footing: suspected shared with porch slab — confirm with the previous owner." Meera watched Ravi flip through it and said what the firm was thinking: "Eleven pages we'll read beats eight hundred photos we won't."</p>
<span class="maps-to">maps to → <b>the cottage</b> = the brownfield estate · <b>load-bearing vs decorative</b> = invariants vs re-derivable detail · <b>red tags for the previous owner</b> = flagged unknowns awaiting human confirmation · <b>eleven pages, not eight hundred photos</b> = high semantics-per-token</span>
</aside>

<h2>High semantics-per-token</h2>
<p>What makes a map good is density, and the reason is economic: context windows are finite and shared with the actual work. Raw code is low-density context — it restates what the system does at 1:1 scale. The map compresses meaning: <em>"eligibility data is up to 24h stale (nightly 02:00 refresh)"</em> is one line that permanently answers the staleness question M07's plan parked at step 4; the code that implies it is 500 lines across two repos and an ops cron table. That ratio — meaning per token spent — is what AI-DLC calls <strong>high semantics-per-token</strong>, and it's the survey's quality bar.</p>
<p>Curation heuristics: record <em>invariants</em> (what must stay true), <em>surprises</em> (what a reasonable engineer would guess wrong), and <em>semantics</em> (what E4 actually means). Skip what any reader re-derives in seconds — getters, DTOs, framework noise. Density isn't a style preference; it's why the map gets read at all, by engines and by humans.</p>
